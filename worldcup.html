<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>점심 메뉴 월드컵</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary:#19a463;
      --bg:#121212;
      --card-bg:#1e1e1e;
      --muted:#888;
      --gold:#ffd54f;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family:'Pretendard', -apple-system, sans-serif;
      background:var(--bg);
      color:white;
      height:100dvh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* 상단 헤더 */
    .top {
      padding: 15px 15px 5px;
      position: relative;
      text-align: center;
      flex-shrink: 0;
    }
    .back-link {
      position: absolute;
      left: 15px;
      top: 18px;
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .title { font-size:20px; font-weight:800; color:var(--primary); margin-top: 25px; }
    .sub { color:var(--muted); font-size:10px; letter-spacing:0.5px; margin-top: 2px; }

    /* 뷰 컨테이너 공통 */
    #question-view, #game-view, #advance-view, #final-intro-view, #winner-view {
      width:100%;
      flex:1;
      display:none;
      flex-direction: column;
      animation:fadeIn 0.3s ease;
      overflow-y: auto;
    }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    /* 메인 선택 화면 */
    #question-view { justify-content:center; align-items:center; gap:12px; padding:20px; }
    .question-card {
      width:100%; max-width:400px; padding:25px 20px; border-radius:20px;
      background:var(--card-bg); border:1px solid #333; text-align:center;
    }

    /* 게임 화면 가로 배치 */
    #match-container {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      flex: 1;
    }

    .card {
      flex: 1;
      max-width: 180px;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #333;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .card-body { padding: 12px 8px; text-align: center; }
    .menu-name { 
      font-size: 14px; font-weight: 700; margin-bottom: 8px; 
      word-break: keep-all; height: 2.8em; overflow: hidden; 
      display: flex; align-items: center; justify-content: center;
    }
    
    /* 영양 정보 영역: 정보가 없어도 높이 유지 */
    .menu-info { 
      display: flex; flex-direction: column; gap: 4px; align-items: center; 
      min-height: 55px; justify-content: flex-start;
    }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); }
    .badge.price { color: var(--primary); font-weight: bold; background: rgba(25,164,99,0.1); }
    .badge.nutri { color: #aaa; }

    .vs { font-size: 18px; font-weight: 900; color: #ff5252; font-style: italic; flex-shrink: 0; }

    /* 결과 및 우승 화면 중앙 정렬 강화 */
    #final-intro-view, #winner-view {
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .winner-card { width: 220px; margin: 0 auto; border: 2px solid var(--gold) !important; box-shadow: 0 0 20px rgba(255, 213, 79, 0.2); }
    
    .btn-wrap { display: flex; gap: 10px; width: 100%; max-width: 300px; margin: 25px auto 0; }
    .btn { border:none; color:white; padding:14px; border-radius:15px; font-weight:700; cursor:pointer; flex: 1; }
    .btn-primary { background:var(--primary); }
    .btn-secondary { background:#333; }

    .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; padding:15px; }
    .grid-item { background:var(--card-bg); border-radius:12px; overflow:hidden; font-size: 11px; text-align: center; border: 1px solid #222; }
    .grid-item img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .grid-item p { padding: 8px 5px; font-weight: 600; }
  </style>
</head>
<body>

  <div class="top">
    <a href="index.html" class="back-link">← HOME</a>
    <div class="title" id="round-title">메뉴 월드컵</div>
    <div class="sub">SALADIA SELECTION LAB</div>
  </div>

  <!-- 시작 화면 -->
  <div id="question-view">
    <div class="question-card" onclick="startWith('light')">
      <h2 style="font-size: 22px; margin-bottom: 5px;">🥗 가벼운 식단</h2>
      <p style="color: var(--muted); font-size: 13px;">샐러드 · 샌드위치 · 요거트</p>
    </div>
    <div class="question-card" onclick="startWith('heavy')">
      <h2 style="font-size: 22px; margin-bottom: 5px;">🍱 든든한 한끼</h2>
      <p style="color: var(--muted); font-size: 13px;">도시락 · 포케 · 푸드</p>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="game-view">
    <div id="match-container"></div>
    <div id="match-refresh-wrap" style="text-align: center; padding-bottom: 20px; display:none;">
      <button id="match-refresh-btn" style="background:none; border:1px solid #444; color:var(--muted); padding:8px 15px; border-radius:10px; font-size:12px;" onclick="refreshCurrentMatch()">
        🔄 다른 메뉴 보기
      </button>
    </div>
  </div>

  <!-- 중간 결과 (진출 메뉴) -->
  <div id="advance-view">
    <div style="text-align:center; padding: 20px 0 10px;">
      <h3 id="advance-title" style="color:var(--gold); font-size: 20px;">진출 메뉴</h3>
      <p id="advance-sub" style="font-size:12px; color:var(--muted)">다음 라운드로 이동합니다.</p>
    </div>
    <div class="grid" id="advance-grid"></div>
    <div style="padding:15px 20px 30px;">
      <button class="btn btn-primary" style="width:100%" onclick="confirmAndNextRound()">다음 라운드 시작</button>
    </div>
  </div>

  <!-- 결승전 진입 연출 -->
  <div id="final-intro-view">
      <h1 style="color:var(--gold); font-size:40px; margin-bottom: 10px; letter-spacing: 2px;">결승전</h1>
      <p style="color:var(--muted); font-size: 16px;">진정한 우승 메뉴는?</p>
  </div>

  <!-- 우승 결과 화면 -->
  <div id="winner-view">
      <h2 style="color:var(--gold); margin-bottom:20px; font-size: 24px;">🏆 최종 우승 🏆</h2>
      <div id="winner-card-slot" style="display: flex; justify-content: center; width: 100%;"></div>
      <div class="btn-wrap">
        <button class="btn btn-primary" onclick="location.reload()">다시하기</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">홈으로</button>
      </div>
  </div>

  <script>
    let allData = {};
    let currentType = null;
    let pool = [];
    let sparePool = [];
    let winners = [];
    let currentIndex = 0;
    let currentRoundSize = 16;
    let refreshChances = 3;
    let pendingNextPool = [];

    // 데이터 로드
    fetch('./data.json')
      .then(res => res.json())
      .then(data => { allData = data; })
      .catch(() => { console.error('data.json 로딩 실패'); });

    function getMenus(type) {
      const cats = type === 'light' ? ['샐러드', '샌드위치', '그릭요거트', '랩'] : ['단백질 도시락', '포케', '푸드'];
      let list = [];
      cats.forEach(c => {
        const items = allData.categories?.find(cat => cat.categoryName === c)?.items || [];
        list.push(...items.filter(i => !i.hidden && i.name && i.image));
      });
      return list;
    }

    function startWith(type) {
      currentType = type;
      const menus = shuffle(getMenus(type));
      if (menus.length < 16) { alert('메뉴가 부족하여 16강을 진행할 수 없습니다.'); return; }
      pool = menus.slice(0, 16);
      sparePool = menus.slice(16);
      currentRoundSize = 16;
      refreshChances = 3;
      switchView('game-view');
      startRound();
    }

    function startRound() {
      currentIndex = 0;
      winners = [];
      updateRoundUI();
      renderMatch();
    }

    function updateRoundUI() {
      document.getElementById('round-title').innerText = currentRoundSize === 2 ? '결승전' : `${currentRoundSize}강`;
      const wrap = document.getElementById('match-refresh-wrap');
      wrap.style.display = currentRoundSize === 16 ? 'block' : 'none';
      if(currentRoundSize === 16) {
        document.getElementById('match-refresh-btn').innerText = `🔄 다른 메뉴 (${refreshChances}/3)`;
      }
    }

    function renderMatch() {
      const container = document.getElementById('match-container');
      if (currentIndex >= pool.length) { finishRound(); return; }
      
      container.style.opacity = '0';
      setTimeout(() => {
        const item1 = pool[currentIndex];
        const item2 = pool[currentIndex + 1];
        container.innerHTML = `
          ${createCard(item1, 0)}
          <div class="vs">VS</div>
          ${createCard(item2, 1)}
        `;
        container.style.opacity = '1';
      }, 150);
    }

    // 카드 생성 (칼로리, 단백질 추가 및 높이 고정)
    function createCard(item, side, isWinner = false) {
      const kcalTag = item.kcal ? `<span class="badge nutri">🔥 ${item.kcal}kcal</span>` : '';
      const proteinTag = item.protein ? `<span class="badge nutri">💪 단백질 ${item.protein}g</span>` : '';
      
      return `
        <div class="card ${isWinner ? 'winner-card' : ''}" ${side !== null ? `onclick="pick(${side})"` : ''}>
          <img src="${item.image}" alt="${item.name}">
          <div class="card-body">
            <div class="menu-name">${item.name}</div>
            <div class="menu-info">
              ${item.price ? `<span class="badge price">${item.price}원</span>` : ''}
              ${kcalTag}
              ${proteinTag}
            </div>
          </div>
        </div>
      `;
    }

    function pick(side) {
      winners.push(pool[currentIndex + side]);
      currentIndex += 2;
      renderMatch();
    }

    function refreshCurrentMatch() {
      if (currentRoundSize !== 16 || refreshChances <= 0 || sparePool.length < 2) return;
      const old1 = pool[currentIndex]; const old2 = pool[currentIndex + 1];
      pool[currentIndex] = sparePool.shift(); pool[currentIndex+1] = sparePool.shift();
      sparePool.push(old1, old2);
      refreshChances--;
      updateRoundUI();
      renderMatch();
    }

    function finishRound() {
      if (winners.length === 1) { showWinner(winners[0]); return; }
      if (winners.length === 8 || winners.length === 4) {
        showAdvancePage(winners, `🔥 ${winners.length*2}강 통과!`, '다음 라운드에 진출할 메뉴들입니다.');
      } else if (winners.length === 2) {
        showFinalIntro(winners);
      } else {
        pool = [...winners]; currentRoundSize = pool.length; startRound();
      }
    }

    function showAdvancePage(items, title, sub) {
      pendingNextPool = [...items];
      document.getElementById('advance-title').innerText = title;
      document.getElementById('advance-sub').innerText = sub;
      const grid = document.getElementById('advance-grid');
      grid.innerHTML = items.map(i => `<div class="grid-item"><img src="${i.image}"><p>${i.name}</p></div>`).join('');
      switchView('advance-view');
    }

    function confirmAndNextRound() {
      pool = [...pendingNextPool]; currentRoundSize = pool.length;
      switchView('game-view'); startRound();
    }

    function showFinalIntro(items) {
      pendingNextPool = [...items];
      switchView('final-intro-view');
      setTimeout(() => { confirmAndNextRound(); }, 1800);
    }

    function showWinner(item) {
      document.getElementById('round-title').innerText = '결과 발표';
      document.getElementById('winner-card-slot').innerHTML = createCard(item, null, true);
      switchView('winner-view');
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#19a463', '#ffd54f', '#ffffff'] });
    }

    function switchView(id) {
      const views = ['question-view', 'game-view', 'advance-view', 'final-intro-view', 'winner-view'];
      views.forEach(v => {
        const el = document.getElementById(v);
        if (v === id) {
          el.style.display = 'flex';
        } else {
          el.style.display = 'none';
        }
      });
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  </script>
</body>
</html>
