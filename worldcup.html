<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Salaria - 취향 맞춤 월드컵</title>
    <style>
        :root { --main-green: #1D7A4D; --accent-red: #ff5252; }
        body { font-family: 'Pretendard', sans-serif; background: #1a1a1a; color: white; text-align: center; margin: 0; overflow-x: hidden; }
        .round-info { font-size: 40px; font-weight: bold; margin: 30px 0; color: var(--main-green); text-shadow: 0 0 10px rgba(29, 122, 77, 0.5); }
        .match-area { display: flex; justify-content: center; align-items: center; gap: 30px; padding: 20px; transition: 0.5s; }
        .card { flex: 1; max-width: 450px; background: #2a2a2a; border-radius: 25px; overflow: hidden; cursor: pointer; border: 4px solid transparent; transition: 0.3s; position: relative; }
        .card:hover { border-color: var(--main-green); transform: translateY(-10px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card img { width: 100%; height: 350px; object-fit: cover; }
        .card-info { padding: 25px; background: linear-gradient(to top, #1a1a1a, transparent); }
        .vs { font-size: 50px; font-weight: 900; color: var(--accent-red); font-style: italic; }
        
        /* 질문지 스타일 */
        .question-card { background: var(--main-green) !important; display: flex; flex-direction: column; justify-content: center; height: 300px; padding: 20px; }
        .question-card h2 { font-size: 28px; line-height: 1.4; }

        #winner-view { display: none; padding: 80px 0; animation: fadeIn 1s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: var(--main-green); color: white; border: none; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="game-view">
        <div class="round-info" id="round-title">오늘의 점심 탐색 중...</div>
        <div class="match-area" id="match-container"></div>
    </div>

    <div id="winner-view">
        <h1 style="color: #FFD700; font-size: 50px;">🏆 오늘의 우승! 🏆</h1>
        <div id="winner-card-container" style="display:flex; justify-content:center; margin: 30px 0;"></div>
        <button onclick="location.href='index.html'">다시 하기</button>
    </div>

    <script>
        let allData = {};
        let pool = []; // 현재 라운드 진행 대상
        let winners = []; // 다음 라운드 진출자
        let currentIdx = 0;
        let isQuestionRound = true; // 초반 질문 단계 여부

        // 1. 데이터 로드
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                allData = data;
                startQuestionRound();
            });

        // 2. 초기 질문 단계 (16강/8강 수준의 필터링)
        function startQuestionRound() {
            isQuestionRound = true;
            const container = document.getElementById('match-container');
            document.getElementById('round-title').innerText = "내 취향 찾기 (1단계)";
            
            // 질문 셋팅 (가벼움 vs 헤비함)
            container.innerHTML = `
                <div class="card question-card" onclick="filterMenu('가벼운거')">
                    <h2>🥗 오늘은 좀<br>가볍게 먹고 싶어</h2>
                    <p>(샌드위치, 샐러드 위주)</p>
                </div>
                <div class="vs">OR</div>
                <div class="card question-card" onclick="filterMenu('헤비한거')">
                    <h2>🥩 오늘 제대로<br>든든하게 먹을래</h2>
                    <p>(포케, 단백질 도시락 위주)</p>
                </div>
            `;
        }

        // 3. 필터링 로직
        function filterMenu(type) {
            let selectedItems = [];
            const cats = allData.categories;

            if (type === '가벼운거') {
                selectedItems = [...cats.find(c => c.categoryName === '샌드위치').items, 
                                 ...cats.find(c => c.categoryName === '샐러드').items];
            } else {
                selectedItems = [...cats.find(c => c.categoryName === '포케').items, 
                                 ...cats.find(c => c.categoryName === '단백질 도시락').items];
            }

            // 섞기 후 8개 혹은 4개 추출 (메뉴 수에 따라 조절)
            pool = selectedItems.sort(() => Math.random() - 0.5).slice(0, 8);
            isQuestionRound = false;
            startTournament();
        }

        // 4. 토너먼트 시작
        function startTournament() {
            currentIdx = 0;
            winners = [];
            updateRoundTitle();
            showMatch();
        }

        function updateRoundTitle() {
            const title = document.getElementById('round-title');
            if (pool.length === 8) title.innerText = "8강";
            else if (pool.length === 4) title.innerText = "4강";
            else if (pool.length === 2) title.innerText = "결승전";
        }

        function showMatch() {
            const container = document.getElementById('match-container');
            if (pool.length === 1) {
                showWinner(pool[0]);
                return;
            }
            container.innerHTML = renderCard(pool[currentIdx], 0) + '<div class="vs">VS</div>' + renderCard(pool[currentIdx+1], 1);
        }

        function renderCard(item, idx) {
            return `<div class="card" onclick="pick(${idx})">
                <img src="${item.image}" onerror="this.src='https://via.placeholder.com/450x350?text=Salaria'">
                <div class="card-info">
                    <h2>${item.name}</h2>
                    <p>${item.price}원 | ${item.kcal || '??'}kcal</p>
                </div>
            </div>`;
        }

        function pick(side) {
            winners.push(pool[currentIdx + side]);
            currentIdx += 2;

            if (currentIdx >= pool.length) {
                pool = [...winners];
                winners = [];
                currentIdx = 0;
                updateRoundTitle();
                
                // 다음 라운드 전환 효과
                document.querySelector('.match-area').style.opacity = 0;
                setTimeout(() => {
                    showMatch();
                    document.querySelector('.match-area').style.opacity = 1;
                }, 400);
            } else {
                showMatch();
            }
        }

        function showWinner(item) {
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('winner-view').style.display = 'block';
            document.getElementById('winner-card-container').innerHTML = renderCard(item, 0);
        }
    </script>
</body>
</html>
