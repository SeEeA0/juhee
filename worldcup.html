<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>점심 메뉴 월드컵</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary:#19a463;
      --bg:#121212;
      --card-bg:#1e1e1e;
      --muted:#888;
      --gold:#ffd54f;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family:'Pretendard', -apple-system, sans-serif;
      background:var(--bg); color:white; height:100dvh;
      display:flex; flex-direction:column; overflow:hidden;
    }

    .top { padding: 20px; position: relative; text-align: center; flex-shrink: 0; }
    .back-link { position: absolute; left: 15px; top: 22px; text-decoration: none; color: var(--muted); font-size: 12px; border: 1px solid #333; padding: 4px 8px; border-radius: 8px; }
    .title { font-size:22px; font-weight:800; color:var(--primary); }

    /* 모든 뷰 공통 */
    #question-view, #game-view, #advance-view, #final-intro-view, #winner-view {
      width:100%; flex:1; display:none; flex-direction: column; 
      align-items: center; 
      animation:fadeIn 0.3s ease; overflow-y: auto;
    }

    /* 요약 화면 */
    #advance-view {
      justify-content: flex-start; 
      padding: 20px 20px 100px 20px; 
    }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    /* 질문 화면 */
    #question-view { justify-content: center; }
    .question-card { width:90%; max-width:450px; padding:40px; border-radius:24px; background:var(--card-bg); border:1px solid #333; text-align:center; cursor: pointer; margin-bottom: 15px; transition: 0.3s; }
    .question-card:hover { border-color: var(--primary); transform: translateY(-5px); }

    /* 게임 화면 */
    #game-view { justify-content: center; }
    #match-container {
      display: flex; flex-direction: row; align-items: center; justify-content: center;
      gap: 20px; padding: 20px; width: 100%; max-width: 1000px;
    }

    .card {
      flex: 1; max-width: 380px; background: var(--card-bg); border-radius: 20px;
      overflow: hidden; border: 2px solid #333; display: flex; flex-direction: column;
      transition: var(--transition); cursor: pointer;
    }
    .card img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
    .card-body { padding: 20px 10px; text-align: center; }
    .menu-name { font-size: 18px; font-weight: 700; margin-bottom: 12px; height: 1.2em; overflow: hidden; }
    .menu-info { display: flex; flex-direction: column; gap: 6px; align-items: center; min-height: 60px; }
    .badge { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.05); }
    .badge.price { color: var(--primary); font-weight: bold; background: rgba(25,164,99,0.1); }

    .vs { font-size: 28px; font-weight: 900; color: #ff5252; font-style: italic; }

    /* 요약 그리드 */
    .grid { 
      display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; 
      padding:20px 0; width: 100%; max-width: 800px; flex-shrink: 0;
    }
    .grid-item { background:none; border-radius:15px; overflow:hidden; text-align: center; }
    .grid-item .sum-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; color: var(--gold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .grid-item img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; border: 1px solid #333; }

    /* 버튼 공통 스타일 */
    .btn { 
      display: flex; align-items: center; justify-content: center;
      border:none; color:white; 
      height: 56px !important; 
      padding: 0 24px;
      border-radius:15px; font-weight:700; cursor:pointer; font-size: 16px; 
      flex-shrink: 0;
    }
    .btn-primary { background:var(--primary); }
    .btn-secondary { background:#333; }

    #final-intro-view { justify-content: center; }
    #final-intro-view h1 { font-size: 60px; color: var(--gold); }

    /* 최종 우승 화면 */
    #winner-view { text-align: center; justify-content: center; }
    .winner-card { width: 320px !important; border: 3px solid var(--gold) !important; box-shadow: 0 0 30px rgba(255,213,79,0.2); margin: 0 auto; }
    
    /* [수정] 버튼 래퍼: 중앙 정렬 속성 강화 */
    .btn-wrap { 
      display:flex; 
      justify-content: center; /* 가로 중앙 정렬 */
      align-items: center; 
      gap:12px; 
      width: 100%; 
      max-width: 400px; 
      margin: 30px auto 40px auto; /* 마진 auto로 좌우 중앙 배치 */
      padding: 0 20px; 
      flex-shrink: 0; 
    }
    .btn-wrap .btn { flex: 1; } /* 버튼들이 공간을 동일하게 나눠가짐 */

    @media (max-width: 600px) {
      .vs { font-size: 18px; margin: 0 -10px; z-index: 10; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .winner-card { width: 280px !important; }
      #match-container { gap: 10px; padding: 10px; }
      #advance-view { padding-bottom: 80px; }
    }
  </style>
</head>
<body>

  <div class="top">
    <a href="index.html" class="back-link">← HOME</a>
    <div class="title" id="round-title">메뉴 월드컵</div>
  </div>

  <div id="question-view">
    <div class="question-card" onclick="startWith('light')">
      <h2 style="font-size: 26px;">🥗 가벼운 식단</h2>
      <p style="color: var(--muted); margin-top:10px;">샐러드 · 샌드위치 · 요거트</p>
    </div>
    <div class="question-card" onclick="startWith('heavy')">
      <h2 style="font-size: 26px;">🍱 든든한 한끼</h2>
      <p style="color: var(--muted); margin-top:10px;">도시락 · 포케 · 푸드</p>
    </div>
  </div>

  <div id="game-view">
    <div id="match-container"></div>
    <div style="margin-top: 20px; flex-shrink: 0;">
      <button id="match-refresh-btn" style="background:none; border:1px solid #444; color:var(--muted); padding:10px 20px; border-radius:12px; cursor:pointer;" onclick="refreshCurrentMatch()">
        🔄 다른 메뉴 보기 (3/3)
      </button>
    </div>
  </div>

  <div id="advance-view">
    <h3 id="advance-title" style="color:var(--gold); font-size: 26px; margin-bottom: 5px; flex-shrink: 0;">라운드 통과!</h3>
    <p style="color:var(--muted); margin-bottom: 10px; flex-shrink: 0;">다음 라운드 진출 메뉴</p>
    <div class="grid" id="advance-grid"></div>
    <button class="btn btn-primary" style="margin: 20px auto; width: 100%; max-width: 300px;" onclick="confirmAndNextRound()">다음 라운드 시작</button>
  </div>

  <div id="final-intro-view">
      <h1>결승전</h1>
      <p style="color:var(--muted); font-size: 18px; margin-top:15px;">진정한 우승 메뉴를 가립니다.</p>
  </div>

  <div id="winner-view">
      <h2 style="color:var(--gold); margin-bottom:25px; font-size: 32px; flex-shrink: 0;">🏆 최종 우승 🏆</h2>
      <div id="winner-card-slot" style="flex-shrink: 0; width: 100%;"></div>
      <div class="btn-wrap">
        <button class="btn btn-secondary" onclick="location.reload()">다시하기</button>
        <button class="btn btn-primary" onclick="location.href='index.html'">홈으로</button>
      </div>
  </div>

  <script>
    let allData = {};
    let pool = [], sparePool = [], winners = [], currentIndex = 0;
    let currentRoundSize = 16, refreshChances = 3, pendingNextPool = [];

    fetch('./data.json').then(res => res.json()).then(data => { 
        allData = data; 
        switchView('question-view');
    });

    function startWith(type) {
      const cats = type === 'light' ? ['샐러드', '샌드위치', '그릭요거트', '랩'] : ['단백질 도시락', '포케', '푸드'];
      let menus = [];
      cats.forEach(c => {
        const cat = allData.categories?.find(cat => cat.categoryName === c);
        if (cat) menus.push(...cat.items.filter(i => !i.hidden && i.image));
      });
      
      menus = shuffle(menus);
      if (menus.length < 16) { alert('메뉴가 부족합니다.'); return; }
      pool = menus.slice(0, 16);
      sparePool = menus.slice(16);
      currentRoundSize = 16;
      refreshChances = 3;
      switchView('game-view');
      startRound();
    }

    function startRound() {
      currentIndex = 0; winners = [];
      document.getElementById('round-title').innerText = currentRoundSize === 2 ? '결승전' : `${currentRoundSize}강`;
      document.getElementById('match-refresh-btn').style.display = currentRoundSize === 16 ? 'inline-block' : 'none';
      document.getElementById('match-refresh-btn').innerText = `🔄 다른 메뉴 보기 (${refreshChances}/3)`;
      renderMatch();
    }

    function renderMatch() {
      const container = document.getElementById('match-container');
      if (currentIndex >= pool.length) { finishRound(); return; }
      const item1 = pool[currentIndex], item2 = pool[currentIndex + 1];
      container.innerHTML = `${createCard(item1, 0)} <div class="vs">VS</div> ${createCard(item2, 1)}`;
    }

    function createCard(item, side, isWinner = false) {
      return `
        <div class="card ${isWinner ? 'winner-card' : ''}" onclick="${side !== null ? `pick(${side})` : ''}">
          <img src="${item.image}">
          <div class="card-body">
            <div class="menu-name">${item.name}</div>
            <div class="menu-info">
              ${item.price ? `<span class="badge price">${item.price}원</span>` : ''}
              ${item.kcal ? `<span class="badge">🔥 ${item.kcal}kcal</span>` : ''}
              ${item.protein ? `<span class="badge">💪 단백질 ${item.protein}g</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    function pick(side) {
      winners.push(pool[currentIndex + side]);
      currentIndex += 2;
      renderMatch();
    }

    function refreshCurrentMatch() {
      if (currentRoundSize !== 16 || refreshChances <= 0 || sparePool.length < 2) return;
      const old1 = pool[currentIndex], old2 = pool[currentIndex + 1];
      pool[currentIndex] = sparePool.shift(); 
      pool[currentIndex+1] = sparePool.shift();
      sparePool.push(old1, old2);
      refreshChances--;
      document.getElementById('match-refresh-btn').innerText = `🔄 다른 메뉴 보기 (${refreshChances}/3)`;
      renderMatch();
    }

    function finishRound() {
      if (winners.length === 1) { 
          document.getElementById('winner-card-slot').innerHTML = createCard(winners[0], null, true);
          switchView('winner-view');
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      } else if (winners.length === 8 || winners.length === 4) {
          pendingNextPool = [...winners];
          document.getElementById('advance-grid').innerHTML = winners.map(i => `
            <div class="grid-item">
              <div class="sum-name">${i.name}</div>
              <img src="${i.image}">
            </div>
          `).join('');
          switchView('advance-view');
      } else if (winners.length === 2) {
          pendingNextPool = [...winners];
          switchView('final-intro-view');
          setTimeout(() => { confirmAndNextRound(); }, 1800);
      }
    }

    function confirmAndNextRound() {
      pool = [...pendingNextPool]; 
      currentRoundSize = pool.length;
      switchView('game-view'); 
      startRound();
    }

    function switchView(id) {
      ['question-view', 'game-view', 'advance-view', 'final-intro-view', 'winner-view'].forEach(v => {
        document.getElementById(v).style.display = (v === id) ? 'flex' : 'none';
      });
      document.getElementById(id).scrollTop = 0;
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  </script>
</body>
</html>
