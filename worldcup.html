<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 이상형 월드컵</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f8f9fa;
        }
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        #game-container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }
        .round-info {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }
        .match-up {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: stretch;
            flex-wrap: wrap;
        }
        .card {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.3s, border 0.3s;
            border: 5px solid transparent;
        }
        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
        }
        .card img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }
        .card-info {
            padding: 20px;
        }
        .card-info h3 {
            margin: 0;
            font-size: 1.5rem;
        }
        .vs {
            display: flex;
            align-items: center;
            font-size: 2rem;
            font-weight: italic;
            color: var(--primary-color);
        }
        .hidden { display: none; }
        #winner-display img {
            width: 80%;
            max-width: 500px;
            border-radius: 20px;
            margin-top: 20px;
        }
        .btn-retry {
            margin-top: 30px;
            padding: 15px 30px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="setup-view">
        <h1>메뉴 이상형 월드컵</h1>
        <p>오늘의 추천 메뉴를 선정해보세요!</p>
        <button class="btn-retry" onclick="startGame()">게임 시작 (16강)</button>
    </div>

    <div id="game-view" class="hidden">
        <div class="round-info" id="round-title">16강</div>
        <div class="match-up">
            <div class="card" id="left-card" onclick="select(0)">
                <img id="left-img" src="" alt="">
                <div class="card-info">
                    <h3 id="left-name">메뉴명</h3>
                </div>
            </div>
            <div class="vs">VS</div>
            <div class="card" id="right-card" onclick="select(1)">
                <img id="right-img" src="" alt="">
                <div class="card-info">
                    <h3 id="right-name">메뉴명</h3>
                </div>
            </div>
        </div>
    </div>

    <div id="result-view" class="hidden">
        <div class="round-info">🏆 최종 우승! 🏆</div>
        <div id="winner-display">
            <img id="winner-img" src="" alt="">
            <h2 id="winner-name">우승 메뉴</h2>
        </div>
        <button class="btn-retry" onclick="location.reload()">다시 하기</button>
    </div>
</div>

<script>
    // JSON 데이터 (제공해주신 구조 예시)
    const menuData = {
        "categories": [
            {
                "categoryName": "그릭요거트",
                "items": [
                    {"name": "플레인 요거트", "image": "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=500", "price": 4500},
                    {"name": "딸기 요거트", "image": "https://images.unsplash.com/photo-1571115177098-24ec42ed2bb4?w=500", "price": 5200}
                ]
            },
            {
                "categoryName": "커피",
                "items": [
                    {"name": "아메리카노", "image": "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500", "price": 4000},
                    {"name": "카페라떼", "image": "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500", "price": 4500},
                    {"name": "바닐라라떼", "image": "https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=500", "price": 5000}
                ]
            },
            {
                "categoryName": "디저트",
                "items": [
                    {"name": "초코케이크", "image": "https://images.unsplash.com/photo-1578985545062-69928b1d9587?w=500", "price": 6000},
                    {"name": "치즈케이크", "image": "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=500", "price": 6500},
                    {"name": "마카롱", "image": "https://images.unsplash.com/photo-1558301211-0d8c8ddee6ec?w=500", "price": 3000}
                ]
            }
        ]
    };

    let allItems = [];
    let currentRoundItems = [];
    let nextRoundItems = [];
    let currentIndex = 0;

    function startGame() {
        // 모든 카테고리의 아이템을 하나로 합침
        allItems = menuData.categories.flatMap(cat => cat.items);
        
        // 무작위 셔플 후 16개 추출 (데이터가 부족하면 전체 사용)
        currentRoundItems = allItems.sort(() => Math.random() - 0.5).slice(0, 16);
        
        document.getElementById('setup-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        updateMatch();
    }

    function updateMatch() {
        const totalMatches = currentRoundItems.length / 2;
        const currentMatch = (currentIndex / 2) + 1;
        
        let roundText = currentRoundItems.length === 2 ? "결승전" : currentRoundItems.length + "강";
        document.getElementById('round-title').innerText = `${roundText} (${currentMatch}/${totalMatches})`;

        const left = currentRoundItems[currentIndex];
        const right = currentRoundItems[currentIndex + 1];

        document.getElementById('left-img').src = left.image;
        document.getElementById('left-name').innerText = left.name;
        document.getElementById('right-img').src = right.image;
        document.getElementById('right-name').innerText = right.name;
    }

    function select(side) {
        // 선택된 아이템을 다음 라운드 리스트에 추가
        const winner = side === 0 ? currentRoundItems[currentIndex] : currentRoundItems[currentIndex + 1];
        nextRoundItems.push(winner);

        currentIndex += 2;

        if (currentIndex >= currentRoundItems.length) {
            // 한 라운드가 끝남
            if (nextRoundItems.length === 1) {
                showWinner(nextRoundItems[0]);
            } else {
                currentRoundItems = nextRoundItems;
                nextRoundItems = [];
                currentIndex = 0;
                updateMatch();
            }
        } else {
            updateMatch();
        }
    }

    function showWinner(item) {
        document.getElementById('game-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('winner-img').src = item.image;
        document.getElementById('winner-name').innerText = item.name;
    }
</script>

</body>
</html>
