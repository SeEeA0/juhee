<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>런치 슬롯 - 랜덤 점메추</title>
    <style>
        :root {
            --primary-color: #1D7A4D;
            --bg-color: #F9FBFA;
            --muted: #888;
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: var(--bg-color); 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            color: #333;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .top-nav {
            width: 100%;
            max-width: 450px;
            padding: 15px 15px 5px;
            position: relative;
            text-align: center;
            box-sizing: border-box;
        }
        
        .back-link {
            position: absolute;
            left: 15px;
            top: 18px;
            text-decoration: none;
            color: var(--muted);
            font-size: 12px;
            border: 1px solid #ddd;
            padding: 4px 8px;
            border-radius: 8px;
            background: white;
        }

        .container { 
            background: white; 
            padding: 25px 20px; 
            border-radius: 30px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.05); 
            width: 92%; 
            max-width: 450px;
            box-sizing: border-box; 
            border: 1px solid #f0f0f0;
            margin: 10px auto 30px;
        }

        h2 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 20px; color: var(--primary-color); }

        .filter-section { margin-bottom: 18px; }
        .filter-title { font-weight: 600; margin-bottom: 10px; display: block; color: #666; font-size: 13px; }
        
        /* [핵심 수정] 카테고리 2줄 정렬을 위한 Grid 설정 */
        .chip-row { 
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 한 줄에 4개씩 균등 배분 */
            gap: 8px; 
            margin-bottom: 8px; 
        }
        
        .chip { 
            display: flex;
            align-items: center;
            justify-content: center;
            height: 38px; /* 높이 고정으로 정렬 유지 */
            border-radius: 10px; 
            background: #f2f2f2; 
            cursor: pointer; 
            font-size: 11.5px; 
            color: #888; 
            transition: 0.2s; 
            text-align: center;
            word-break: keep-all;
            box-sizing: border-box;
            border: 1px solid transparent;
        }
        
        /* 텍스트가 긴 항목 대응 */
        .chip[data-cat="단백질 도시락"] { font-size: 10px; }

        .chip.active { 
            background: var(--primary-color); 
            color: white; 
            font-weight: 700;
        }

        /* 좁은 모바일 화면 대응 */
        @media (max-width: 360px) {
            .chip-row { grid-template-columns: repeat(3, 1fr); }
            .chip { font-size: 11px; height: 34px; }
        }

        .slot-machine-v2 {
            background: #fff; padding: 8px; border-radius: 20px;
            border: 1px solid #eee; box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            margin: 15px 0; position: relative;
        }

        .window {
            height: 70px; background: #fdfdfd; border-radius: 12px;
            overflow: hidden; position: relative; display: flex;
            align-items: center; justify-content: center; border: 1px solid #f0f0f0;
        }

        .reel { display: flex; flex-direction: column; align-items: center; position: absolute; top: 0; width: 100%; }
        .slot-item { height: 70px; line-height: 70px; text-align: center; font-size: 17px; font-weight: 700; color: #222; width: 100%; }

        #final-result { text-align: center; }
        #result-img { 
            width: 130px; height: 130px; border-radius: 20px; 
            object-fit: cover; display: none; margin: 10px auto 12px; 
            border: 1px solid #eee;
        }

        .info-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 8px; }
        .tag { 
            background: #f8f9fa; border: 1px solid #eee; padding: 3px 8px; 
            border-radius: 6px; font-size: 11px; color: #555;
        }

        #result-price { font-size: 20px; color: var(--primary-color); font-weight: 800; margin-bottom: 15px; }

        .btn-spin {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            background: var(--primary-color); color: white; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 12px rgba(29, 122, 77, 0.2);
        }
        .btn-spin:disabled { background: #d1d1d1; box-shadow: none; }
        .btn-spin:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="index.html" class="back-link">← HOME</a>
</div>

<div class="container">
    <h2>🥗 런치 슬롯</h2>

    <!-- 카테고리 필터: 4개씩 2줄 자동 정렬 -->
    <div class="filter-section">
        <span class="filter-title">카테고리</span>
        <div class="chip-row">
            <div class="chip category-chip" data-cat="샐러드">샐러드</div>
            <div class="chip category-chip" data-cat="포케">포케</div>
            <div class="chip category-chip" data-cat="샌드위치">샌드위치</div>
            <div class="chip category-chip" data-cat="커리 덮밥">커리덮밥</div>
            <div class="chip category-chip" data-cat="랩">랩</div>
            <div class="chip category-chip" data-cat="단백질 도시락">단백질 도시락</div>
            <div class="chip category-chip" data-cat="푸드">푸드</div>
            <div class="chip category-chip" data-cat="그릭요거트">그릭요거트</div>
        </div>
    </div>
    
    <!-- 가격대 필터: 4개 1줄 정렬 -->
    <div class="filter-section">
        <span class="filter-title">가격대</span>
        <div class="chip-row">
            <div class="chip price-chip" data-range="0-7900">~ 7.9</div>
            <div class="chip price-chip" data-range="8000-8900">8.0-8.9</div>
            <div class="chip price-chip" data-range="9000-9900">9.0-9.9</div>
            <div class="chip price-chip" data-range="10000-999999">10.0~</div>
        </div>
    </div>

    <div class="slot-machine-v2">
        <div class="window">
            <div class="reel" id="reel"><div class="slot-item">무엇을 먹을까요?</div></div>
        </div>
    </div>

    <div id="final-result">
        <img id="result-img" src="">
        <div id="info-tags" class="info-tags"></div>
        <div id="result-price"></div>
    </div>

    <button class="btn-spin" id="spin-btn" onclick="spin()">슬롯 돌리기!</button>
</div>

<script>
    let menuData = [];

    // 칩 클릭 이벤트 등록
    document.querySelectorAll('.chip').forEach(chip => {
        chip.onclick = () => chip.classList.toggle('active');
    });

    // 데이터 로드
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            menuData = data.categories;
        })
        .catch(err => console.error("데이터를 불러오지 못했습니다.", err));

    function spin() {
        const reel = document.getElementById('reel');
        const btn = document.getElementById('spin-btn');
        const img = document.getElementById('result-img');
        const price = document.getElementById('result-price');
        const tags = document.getElementById('info-tags');

        // 필터링 조건 수집
        let selectedCats = Array.from(document.querySelectorAll('.category-chip.active')).map(c => c.getAttribute('data-cat'));
        let selectedPriceRanges = Array.from(document.querySelectorAll('.price-chip.active')).map(c => c.dataset.range);

        // 데이터 필터링
        let filtered = [];
        menuData.forEach(cat => {
            if (selectedCats.length === 0 || selectedCats.includes(cat.categoryName)) {
                cat.items.forEach(item => {
                    const p = parseInt(item.price.replace(/,/g, ''));
                    const isP = selectedPriceRanges.length === 0 || selectedPriceRanges.some(r => {
                        const [min, max] = r.split('-').map(Number);
                        return p >= min && p <= max;
                    });
                    if (isP) filtered.push(item);
                });
            }
        });

        if (filtered.length === 0) return alert("조건에 맞는 메뉴가 없어요!");

        // UI 초기화
        btn.disabled = true;
        img.style.display = 'none';
        price.innerText = '';
        tags.innerHTML = '';
        reel.innerHTML = '';
        
        // 슬롯 애니메이션 아이템 생성
        const spinCount = 30; 
        for(let i=0; i<spinCount; i++) {
            const item = filtered[Math.floor(Math.random() * filtered.length)];
            const div = document.createElement('div');
            div.className = 'slot-item';
            div.innerText = item.name;
            reel.appendChild(div);
        }

        const finalMenu = filtered[Math.floor(Math.random() * filtered.length)];
        const finalDiv = document.createElement('div');
        finalDiv.className = 'slot-item';
        finalDiv.innerText = finalMenu.name;
        reel.appendChild(finalDiv);

        // 애니메이션 실행
        let startTime = null;
        const duration = 2000;
        const itemHeight = 70;
        const targetPos = -(spinCount * itemHeight);

        function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = timestamp - startTime;
            const p = Math.min(progress / duration, 1);
            const easedP = easeOutExpo(p);
            reel.style.top = (easedP * targetPos) + 'px';

            if (p < 1) {
                requestAnimationFrame(step);
            } else {
                // 결과 출력
                if(finalMenu.image) { 
                    img.src = finalMenu.image; 
                    img.style.display = 'block'; 
                }
                let tagHTML = '';
                if(finalMenu.weight) tagHTML += `<div class="tag">중량: <b>${finalMenu.weight}g</b></div>`;
                if(finalMenu.kcal) tagHTML += `<div class="tag">칼로리: <b>${finalMenu.kcal}kcal</b></div>`;
                if(finalMenu.protein) tagHTML += `<div class="tag">단백질: <b>${finalMenu.protein}g</b></div>`;
                tags.innerHTML = tagHTML;
                price.innerText = finalMenu.price + "원";
                btn.disabled = false;
            }
        }
        requestAnimationFrame(step);
    }
</script>
</body>
</html>
