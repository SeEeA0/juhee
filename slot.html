<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>런치 슬롯 - 귀차니즘을 위한</title>
    <style>
        :root {
            --primary-color: #1D7A4D;
            --bg-color: #F9FBFA;
            --glass-bg: rgba(255, 255, 255, 0.8);
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: var(--bg-color); 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
            color: #333;
        }

        .container { 
            background: white; padding: 40px 30px; border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
            width: 100%; max-width: 450px; box-sizing: border-box; 
            border: 1px solid #f0f0f0;
        }

        h2 { 
            font-size: 22px; font-weight: 700; text-align: center; 
            margin-bottom: 30px; color: var(--primary-color);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* 필터 섹션: 더 깔끔하고 미니멀하게 */
        .filter-section { margin-bottom: 20px; }
        .filter-title { font-weight: 600; margin-bottom: 12px; display: block; color: #666; font-size: 13px; }
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { 
            padding: 8px 16px; border-radius: 12px; background: #f2f2f2; 
            cursor: pointer; font-size: 13px; border: 1px solid transparent; 
            color: #888; transition: all 0.3s ease; 
        }
        .chip.active { 
            background: var(--primary-color); color: white; 
            box-shadow: 0 4px 10px rgba(29,122,77,0.2); 
        }

        /* 원통형 슬롯: 블랙을 제거하고 투명하고 밝은 느낌으로 */
        .slot-machine-v2 {
            background: #fff;
            padding: 10px;
            border-radius: 20px;
            border: 1px solid #eee;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin: 30px 0;
            position: relative;
        }

        .window {
            height: 90px;
            background: #fdfdfd;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #f0f0f0;
        }

        /* 세련된 그라데이션 효과 (입체감) */
        .window::before, .window::after {
            content: '';
            position: absolute;
            left: 0; width: 100%; height: 35%; z-index: 2;
            pointer-events: none;
        }
        .window::before { top: 0; background: linear-gradient(to bottom, rgba(255,255,255,0.9), transparent); }
        .window::after { bottom: 0; background: linear-gradient(to top, rgba(255,255,255,0.9), transparent); }

        .reel {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            width: 100%;
        }

        .slot-item {
            height: 90px;
            line-height: 90px;
            text-align: center;
            font-size: 19px;
            font-weight: 700;
            color: #222;
            width: 100%;
        }

        /* 결과 노출 영역 */
        #final-result {
            text-align: center;
            min-height: 180px;
            margin-top: 10px;
        }
        #result-img { 
            width: 130px; height: 130px; border-radius: 20px; 
            object-fit: cover; display: none; margin: 0 auto 10px; 
            border: 1px solid #eee;
            animation: slideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        #result-price { font-size: 20px; color: var(--primary-color); font-weight: 800; }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .btn-spin {
            width: 100%; padding: 20px; border: none; border-radius: 18px;
            background: var(--primary-color); color: white; font-size: 18px; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(29,122,77,0.15);
        }
        .btn-spin:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(29,122,77,0.2); }
        .btn-spin:disabled { background: #d1d1d1; box-shadow: none; }

        .btn-back { display: block; text-align: center; margin-top: 20px; color: #bbb; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥗 런치 드럼 슬롯</h2>

    <div class="filter-section">
        <span class="filter-title">카테고리</span>
        <div id="category-chips" class="chip-group"></div>
    </div>
    
    <div class="filter-section">
        <span class="filter-title">가격대</span>
        <div id="price-chips" class="chip-group">
            <div class="chip" data-range="0-7900">~ 7.9</div>
            <div class="chip" data-range="8000-8900">8.0-8.9</div>
            <div class="chip" data-range="9000-9900">9.0-9.9</div>
            <div class="chip" data-range="10000-999999">10.0~</div>
        </div>
    </div>

    <!-- 수정된 슬롯 머신 디자인 -->
    <div class="slot-machine-v2">
        <div class="window">
            <div class="reel" id="reel">
                <div class="slot-item">무엇을 먹을까요?</div>
            </div>
        </div>
    </div>

    <div id="final-result">
        <img id="result-img" src="">
        <div id="result-price"></div>
    </div>

    <button class="btn-spin" id="spin-btn" onclick="spin()">슬롯 돌리기!</button>
    <a href="index.html" class="btn-back">처음으로 돌아가기</a>
</div>

<script>
    let menuData = [];

    fetch('data.json').then(res => res.json()).then(data => {
        menuData = data.categories;
        const container = document.getElementById('category-chips');
        menuData.forEach(cat => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerText = cat.categoryName;
            chip.onclick = () => chip.classList.toggle('active');
            container.appendChild(chip);
        });
    });

    document.querySelectorAll('#price-chips .chip').forEach(c => {
        c.onclick = () => c.classList.toggle('active');
    });

    function spin() {
        const reel = document.getElementById('reel');
        const btn = document.getElementById('spin-btn');
        const img = document.getElementById('result-img');
        const price = document.getElementById('result-price');

        let selectedCats = Array.from(document.querySelectorAll('#category-chips .chip.active')).map(c => c.innerText);
        let selectedPriceRanges = Array.from(document.querySelectorAll('#price-chips .chip.active')).map(c => c.dataset.range);

        let filtered = [];
        menuData.forEach(cat => {
            if (selectedCats.length === 0 || selectedCats.includes(cat.categoryName)) {
                cat.items.forEach(item => {
                    const p = parseInt(item.price.replace(/,/g, ''));
                    const isP = selectedPriceRanges.length === 0 || selectedPriceRanges.some(r => {
                        const [min, max] = r.split('-').map(Number);
                        return p >= min && p <= max;
                    });
                    if (isP) filtered.push(item);
                });
            }
        });

        if (filtered.length === 0) return alert("조건에 맞는 메뉴가 없어요!");

        btn.disabled = true;
        img.style.display = 'none';
        price.innerText = '';
        reel.innerHTML = '';
        
        const spinCount = 30; 
        for(let i=0; i<spinCount; i++) {
            const item = filtered[Math.floor(Math.random() * filtered.length)];
            const div = document.createElement('div');
            div.className = 'slot-item';
            div.innerText = item.name;
            reel.appendChild(div);
        }

        const finalMenu = filtered[Math.floor(Math.random() * filtered.length)];
        const finalDiv = document.createElement('div');
        finalDiv.className = 'slot-item';
        finalDiv.innerText = finalMenu.name;
        reel.appendChild(finalDiv);

        let startTime = null;
        const duration = 3000; 
        const itemHeight = 90;
        const targetPos = -(spinCount * itemHeight);

        function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = timestamp - startTime;
            const p = Math.min(progress / duration, 1);
            const easedP = easeOutExpo(p);
            
            reel.style.top = (easedP * targetPos) + 'px';

            if (p < 1) {
                requestAnimationFrame(step);
            } else {
                if(finalMenu.image) {
                    img.src = finalMenu.image;
                    img.style.display = 'block';
                }
                price.innerText = finalMenu.price + "원";
                btn.disabled = false;
            }
        }
        requestAnimationFrame(step);
    }
</script>
</body>
</html>
