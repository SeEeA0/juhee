<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 랜덤 룰렛</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f4f0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { color: #1D7A4D; text-align: center; margin-bottom: 25px; font-size: 28px; }
        
        .filter-section { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .filter-title { font-weight: bold; margin-bottom: 12px; display: block; color: #444; font-size: 15px; }
        
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { padding: 8px 16px; border-radius: 20px; background: #f0f0f0; cursor: pointer; font-size: 14px; transition: 0.2s; border: 1px solid #e0e0e0; color: #666; }
        .chip.active { background: #1D7A4D; color: white; border-color: #1D7A4D; font-weight: 500; }

        .result-area { text-align: center; margin: 25px 0; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fafafa; border: 2px dashed #1D7A4D; border-radius: 20px; padding: 20px; position: relative; overflow: hidden; }
        #menu-image { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; display: none; border: 4px solid #1D7A4D; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #menu-name { font-size: 22px; font-weight: bold; margin: 5px 0; color: #333; }
        #menu-price { color: #1D7A4D; font-size: 18px; font-weight: bold; }

        .btn-spin { width: 100%; padding: 18px; border: none; border-radius: 15px; background: #1D7A4D; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(29,122,77,0.3); }
        .btn-spin:active { transform: translateY(2px); box-shadow: none; }
        
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #888; text-decoration: none; font-size: 14px; }
        .btn-back:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎰 메뉴 슬롯머신</h2>

    <div class="filter-section">
        <span class="filter-title">🍴 카테고리 선택 (미선택 시 전체)</span>
        <div id="category-chips" class="chip-group"></div>
    </div>

    <div class="filter-section">
        <span class="filter-title">💰 가격대 선택 (미선택 시 전체)</span>
        <div id="price-chips" class="chip-group">
            <div class="chip" data-range="0-7900">~ 7,900</div>
            <div class="chip" data-range="8000-8900">8,000-8,900</div>
            <div class="chip" data-range="9000-9900">9,000-9,900</div>
            <div class="chip" data-range="10000-999999">10,000~</div>
        </div>
    </div>

    <div class="result-area" id="result-area">
        <img id="menu-image" src="" alt="메뉴 이미지">
        <div id="menu-name">준비되셨나요?</div>
        <div id="menu-price">버튼을 눌러주세요!</div>
    </div>

    <button class="btn-spin" onclick="spinSlot()">슬롯 돌리기!</button>
    <a href="index.html" class="btn-back">🔙 메인 페이지로 이동</a>
</div>

<script>
    let menuData = [];

    // 1. 데이터 로드 및 초기화
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            menuData = data.categories;
            const container = document.getElementById('category-chips');
            menuData.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = 'chip'; // 기본은 비활성 상태 (선택 안하면 전체로 로직 처리)
                chip.innerText = cat.categoryName;
                chip.onclick = () => chip.classList.toggle('active');
                container.appendChild(chip);
            });
        });

    // 가격칩 클릭 이벤트 설정
    document.querySelectorAll('#price-chips .chip').forEach(chip => {
        chip.onclick = () => chip.classList.toggle('active');
    });

    // 2. 슬롯 로직
    function spinSlot() {
        let selectedCats = Array.from(document.querySelectorAll('#category-chips .chip.active')).map(c => c.innerText);
        let selectedPriceRanges = Array.from(document.querySelectorAll('#price-chips .chip.active')).map(c => c.dataset.range);

        // [핵심] 아무것도 선택 안했을 경우 전체를 대상으로 함
        const isAllCats = selectedCats.length === 0;
        const isAllPrices = selectedPriceRanges.length === 0;

        let filteredMenus = [];
        menuData.forEach(cat => {
            // 카테고리가 일치하거나, 아무것도 선택 안했거나
            if (isAllCats || selectedCats.includes(cat.categoryName)) {
                cat.items.forEach(item => {
                    const price = parseInt(item.price.replace(/,/g, ''));
                    const isPriceMatch = isAllPrices || selectedPriceRanges.some(range => {
                        const [min, max] = range.split('-').map(Number);
                        return price >= min && price <= max;
                    });
                    if (isPriceMatch) filteredMenus.push(item);
                });
            }
        });

        if (filteredMenus.length === 0) {
            alert("선택한 조건에 맞는 메뉴가 없습니다! 범위를 넓혀주세요.");
            return;
        }

        // 애니메이션 효과
        const nameEl = document.getElementById('menu-name');
        const priceEl = document.getElementById('menu-price');
        const imgEl = document.getElementById('menu-image');
        
        imgEl.style.display = 'none';
        let count = 0;
        const interval = setInterval(() => {
            const temp = filteredMenus[Math.floor(Math.random() * filteredMenus.length)];
            nameEl.innerText = temp.name;
            priceEl.innerText = temp.price + "원";
            count++;

            if (count > 12) {
                clearInterval(interval);
                const final = filteredMenus[Math.floor(Math.random() * filteredMenus.length)];
                nameEl.innerText = final.name;
                priceEl.innerText = final.price + "원";
                if(final.image) {
                    imgEl.src = final.image;
                    imgEl.style.display = 'block';
                }
            }
        }, 70);
    }
</script>
</body>
</html>
