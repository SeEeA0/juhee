<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>오.점.뭐 - 오늘의 점심 뭐 먹지?</title>

<style>
:root {
    --primary-color: #1D7A4D;
    --bg-color: #F9FBFA;
}

body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #333;
    min-height: 100vh;
}

.main-wrapper {
    width: 92%;
    max-width: 450px;
    background: white;
    padding: 40px 25px;
    border-radius: 40px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.05);
    margin: 40px 0 20px;
    text-align: center;
    box-sizing: border-box;
}

.badge {
    background: var(--primary-color);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
    display: inline-block;
    margin-bottom: 15px;
}

h1 {
    font-size: 28px;
    font-weight: 800;
    color: #2D5A44;
    margin: 0 0 10px;
}

.sub-text {
    color: #888;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 30px;
}

.menu-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
}

.menu-item {
    background: white;
    border: 1px solid #f0f0f0;
    padding: 20px;
    border-radius: 20px;
    text-decoration: none;
    color: #333;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: 0.2s;
}

.comment-area {
    width: 92%;
    max-width: 450px;
    background: white;
    padding: 25px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    margin-bottom: 50px;
    box-sizing: border-box;
}

.comment-header h3 {
    font-size: 18px;
    color: var(--primary-color);
    margin: 0;
}

.comment-header p {
    font-size: 13px;
    color: #888;
    margin: 6px 0 20px;
}

.comment-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.comment-form input,
.comment-form textarea {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 13px;
    font-size: 14px;
    font-family: inherit;
}

.comment-form textarea {
    min-height: 80px;
    resize: none;
}

.comment-form button {
    border: none;
    background: var(--primary-color);
    color: white;
    padding: 14px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 15px;
}

.comment-count {
    margin: 22px 0 10px;
    font-weight: 800;
}

.comment-item {
    border-top: 1px solid #eee;
    padding: 14px 0;
}

.comment-name {
    font-weight: 800;
    color: #2D5A44;
    margin-bottom: 5px;
}

.comment-text {
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
}

.comment-date {
    font-size: 12px;
    color: #aaa;
    margin-top: 6px;
}

#main-closed-msg {
    padding: 35px 20px;
    text-align: center;
    background: #f9f9f9;
    border-radius: 20px;
    color: #aaa;
    display: none;
}

footer {
    font-size: 12px;
    color: #ccc;
    margin-top: auto;
    padding-bottom: 20px;
}

footer b {
    color: #aaa;
}
</style>
</head>

<body>

<div class="main-wrapper">
    <span class="badge">오.점.뭐</span>
    <h1>오늘 점심 뭐 먹지?</h1>
    <p class="sub-text">점심메뉴 고르는거<br>한번에 결정하기</p>

    <div class="menu-list">
        <a href="slot.html" class="menu-item">🎰 점심 메뉴 랜덤 슬롯</a>
        <a href="worldcup.html" class="menu-item">🏆 메뉴 결정 월드컵</a>
        <a href="list.html" class="menu-item">📋 전체 메뉴판 보기</a>
    </div>
</div>

<div class="comment-area">
    <div class="comment-header">
        <h3>💬 오늘의 점심 PICK!</h3>
        <p>월드컵, 슬롯 결과나 고른 메뉴를 남겨주세요!</p>
    </div>

    <div id="comment-open-area">
        <div class="comment-form">
            <input id="commentName" placeholder="이름 적어주세요">
            <textarea id="commentText" placeholder="10:30분 마감입니다"></textarea>
            <button id="submitComment">메뉴 전송</button>
        </div>

        <div class="comment-count" id="commentCount">픽 완료 0명</div>
        <div id="commentList"></div>
    </div>

    <div id="main-closed-msg">
        <span style="font-size:30px;">⏰</span>
        <p>댓글 작성 가능 시간은 <b>09:00 ~ 10:30</b>입니다.</p>
    </div>
</div>

<footer>Designed by <b>Ju-hee</b> for Salaria</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCDporftDW3TwgAWY3SRWreTdZn_PIhPPU",
    authDomain: "lunch-comment.firebaseapp.com",
    projectId: "lunch-comment",
    storageBucket: "lunch-comment.firebasestorage.app",
    messagingSenderId: "441994205464",
    appId: "1:441994205464:web:64701874c1a7c86c63666d"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const now = new Date();
const day = now.getDay();
const hours = now.getHours();

const yyyy = now.getFullYear();
const mm = String(now.getMonth() + 1).padStart(2, "0");
const dd = String(now.getDate()).padStart(2, "0");
const today = `${yyyy}-${mm}-${dd}`;

const isLiveTime = day >= 1 && day <= 5 && hours >= 9 && hours < 24;

const openArea = document.getElementById("comment-open-area");
const closedMsg = document.getElementById("main-closed-msg");
const nameInput = document.getElementById("commentName");
const textInput = document.getElementById("commentText");
const submitBtn = document.getElementById("submitComment");
const commentList = document.getElementById("commentList");
const commentCount = document.getElementById("commentCount");

if (!isLiveTime) {
    openArea.style.display = "none";
    closedMsg.style.display = "block";
}

const commentsRef = collection(db, "lunch-comments", today, "comments");

submitBtn.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    const text = textInput.value.trim();

    if (!text) {
        alert("메뉴를 입력해주세요.");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "전송 중...";

    try {
        await addDoc(commentsRef, {
            name: name || "익명",
            text,
            createdAt: serverTimestamp()
        });

        textInput.value = "";
    } catch (error) {
        alert("메뉴 등록에 실패했습니다.");
        console.error(error);
    }

    submitBtn.disabled = false;
    submitBtn.textContent = "메뉴전송";
});

const q = query(commentsRef, orderBy("createdAt", "desc"));

onSnapshot(q, (snapshot) => {
    commentList.innerHTML = "";
    commentCount.textContent = `픽 완료 ${snapshot.size}명`;

    snapshot.forEach((doc) => {
        const data = doc.data();

        const item = document.createElement("div");
        item.className = "comment-item";

        const date = data.createdAt?.toDate
            ? data.createdAt.toDate().toLocaleTimeString("ko-KR", {
                hour: "2-digit",
                minute: "2-digit"
            })
            : "";

        item.innerHTML = `
            <div class="comment-name">${escapeHtml(data.name || "익명")}</div>
            <div class="comment-text">${escapeHtml(data.text || "")}</div>
            <div class="comment-date">${date}</div>
        `;

        commentList.appendChild(item);
    });
});

function escapeHtml(text) {
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
</script>

</body>
</html>
