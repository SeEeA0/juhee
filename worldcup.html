<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>점심 메뉴 월드컵</title>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Pretendard',sans-serif;
      background:#121212;
      color:white;
      overflow-x:hidden;
    }

    .top{
      text-align:center;
      padding:30px 20px 10px;
    }

    .title{
      font-size:38px;
      font-weight:800;
      color:#19a463;
      margin-bottom:10px;
    }

    .sub{
      color:#888;
      font-size:15px;
    }

    #match-container{
      width:100%;
      max-width:1400px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:30px;
      padding:30px;
    }

    .card{
      width:100%;
      max-width:500px;
      background:#1e1e1e;
      border-radius:30px;
      overflow:hidden;
      cursor:pointer;
      transition:.25s;
      border:3px solid transparent;
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:#19a463;
    }

    .card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      display:block;
      background:#2a2a2a;
    }

    .card-body{
      padding:24px;
    }

    .menu-name{
      font-size:26px;
      font-weight:700;
      line-height:1.4;
      margin-bottom:15px;
      word-break:keep-all;
    }

    .menu-info{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
    }

    .badge{
      background:#2c2c2c;
      border-radius:999px;
      padding:8px 14px;
      font-size:15px;
      color:#ddd;
    }

    .price{
      color:#19a463;
      font-weight:700;
    }

    .vs{
      font-size:60px;
      font-weight:900;
      color:#ff5252;
      min-width:120px;
      text-align:center;
    }

    .question-wrap{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      padding:50px 20px;
      flex-wrap:wrap;
    }

    .question-card{
      width:100%;
      max-width:420px;
      min-height:280px;
      border-radius:30px;
      background:#1e1e1e;
      border:3px solid #19a463;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:30px;
      cursor:pointer;
      transition:.25s;
    }

    .question-card:hover{
      transform:translateY(-5px);
      background:#232323;
    }

    .question-card h2{
      font-size:34px;
      line-height:1.5;
    }

    .question-card small{
      display:block;
      margin-top:15px;
      color:#999;
      font-size:18px;
      line-height:1.5;
    }

    #winner-view{
      display:none;
      padding:50px 20px;
      text-align:center;
    }

    .winner-title{
      font-size:46px;
      font-weight:900;
      color:#ffd54f;
      margin-bottom:30px;
    }

    .winner-card{
      width:100%;
      max-width:550px;
      margin:0 auto;
      background:#1e1e1e;
      border-radius:30px;
      overflow:hidden;
      border:4px solid #ffd54f;
    }

    .winner-card img{
      width:100%;
      aspect-ratio:1/1;
      object-fit:cover;
      display:block;
    }

    .btn-wrap{
      margin-top:35px;
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      padding:15px 24px;
      border-radius:14px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
      color:white;
    }

    .save-btn{
      background:#e91e63;
    }

    .retry-btn{
      background:#19a463;
    }

    .home-btn{
      background:#444;
    }

    button:hover{
      opacity:.9;
      transform:translateY(-2px);
    }

    @media(max-width:900px){

      #match-container{
        flex-direction:column;
        gap:15px;
      }

      .vs{
        font-size:40px;
        min-width:auto;
      }

      .title{
        font-size:30px;
      }

      .menu-name{
        font-size:22px;
      }

      .question-card h2{
        font-size:28px;
      }

    }
  </style>
</head>

<body>

<div class="top">
  <div class="title" id="round-title">오늘 점심 뭐 먹지?</div>
  <div class="sub">Salaria Lunch WorldCup</div>
</div>

<div id="question-view" class="question-wrap">
  <div class="question-card" onclick="prepareTournament('light')">
    <div>
      <h2>
        🥗 가볍게 먹고싶다
      </h2>
      <small>
        샐러드 · 샌드위치 · 그릭요거트 · 랩
      </small>
    </div>
  </div>

  <div class="question-card" onclick="prepareTournament('heavy')">
    <div>
      <h2>
        🍖 든든하게 먹고싶다
      </h2>
      <small>
        단백질도시락 · 포케 · 푸드
      </small>
    </div>
  </div>
</div>

<div id="game-view" style="display:none;">
  <div id="match-container"></div>
</div>

<div id="winner-view">
  <div id="capture-area">
    <div class="winner-title">🏆 오늘의 메뉴 🏆</div>

    <div class="winner-card" id="winner-card"></div>
  </div>

  <div class="btn-wrap">
    <button class="save-btn" onclick="saveImage()">📸 이미지 저장</button>
    <button class="retry-btn" onclick="location.reload()">🔄 다시하기</button>
    <button class="home-btn" onclick="location.reload()">🏠 홈</button>
  </div>
</div>

<script>

let allData = {};
let pool = [];
let winners = [];
let currentIndex = 0;

fetch('./data.json')
  .then(res => {
    if(!res.ok){
      throw new Error('data.json not found');
    }
    return res.json();
  })
  .then(data => {
    allData = data;
    console.log('JSON 로드 완료');
  })
  .catch(err => {
    console.error(err);
    alert('data.json 파일을 찾을 수 없습니다.');
  });

function getCategory(name){
  return allData.categories.find(c => c.categoryName === name)?.items || [];
}

function prepareTournament(type){

  document.getElementById('question-view').style.display='none';
  document.getElementById('game-view').style.display='block';

  if(type === 'light'){
    pool = [
      ...getCategory('샌드위치'),
      ...getCategory('샐러드'),
      ...getCategory('그릭요거트'),
      ...getCategory('랩')
    ];
  }else{
    pool = [
      ...getCategory('단백질 도시락'),
      ...getCategory('포케'),
      ...getCategory('푸드')
    ];
  }

  pool = shuffle(pool).slice(0,16);

  startRound();
}

function shuffle(arr){
  return [...arr].sort(() => Math.random() - 0.5);
}

function startRound(){

  currentIndex = 0;
  winners = [];

  updateRoundTitle();
  showMatch();
}

function updateRoundTitle(){

  if(pool.length === 2){
    document.getElementById('round-title').innerText = '🔥 결승전';
  }else{
    document.getElementById('round-title').innerText = `🍽 ${pool.length}강`;
  }
}

function showMatch(){

  if(pool.length === 1){
    showWinner(pool[0]);
    return;
  }

  const item1 = pool[currentIndex];
  const item2 = pool[currentIndex+1];

  const container = document.getElementById('match-container');

  container.innerHTML = `
    ${renderCard(item1,0)}
    <div class="vs">VS</div>
    ${renderCard(item2,1)}
  `;
}

function renderCard(item,index){

  const imageUrl = item.image;

  return `
    <div class="card" onclick="pick(${index})">

      <img
        src="${imageUrl}"
        loading="eager"
        referrerpolicy="no-referrer"
        onerror="
          this.onerror=null;
          this.src='https://images.weserv.nl/?url=${encodeURIComponent(imageUrl.replace('https://',''))}';
        "
      >

      <div class="card-body">

        <div class="menu-name">
          ${item.name}
        </div>

        <div class="menu-info">

          <div class="badge price">
            ${item.price}원
          </div>

          ${
            item.weight
            ? `<div class="badge">⚖ ${item.weight}g</div>`
            : ``
          }

          ${
            item.kcal
            ? `<div class="badge">🔥 ${item.kcal}kcal</div>`
            : ``
          }

          ${
            item.protein
            ? `<div class="badge">💪 단백질 ${item.protein}g</div>`
            : ``
          }

        </div>

      </div>
    </div>
  `;
}

function pick(side){

  winners.push(pool[currentIndex + side]);

  currentIndex += 2;

  if(currentIndex >= pool.length){

    pool = winners;
    startRound();

  }else{

    showMatch();

  }
}

function showWinner(item){

  document.getElementById('game-view').style.display='none';
  document.getElementById('winner-view').style.display='block';

  document.getElementById('winner-card').innerHTML = `
    <img
      src="${item.image}"
      referrerpolicy="no-referrer"
      onerror="
        this.onerror=null;
        this.src='https://images.weserv.nl/?url=${encodeURIComponent(item.image.replace('https://',''))}';
      "
    >

    <div class="card-body">

      <div class="menu-name">
        ${item.name}
      </div>

      <div class="menu-info">

        <div class="badge price">
          ${item.price}원
        </div>

        ${
          item.weight
          ? `<div class="badge">⚖ ${item.weight}g</div>`
          : ``
        }

        ${
          item.kcal
          ? `<div class="badge">🔥 ${item.kcal}kcal</div>`
          : ``
        }

        ${
          item.protein
          ? `<div class="badge">💪 단백질 ${item.protein}g</div>`
          : ``
        }

      </div>

    </div>
  `;

  confetti({
    particleCount:180,
    spread:90,
    origin:{y:0.6}
  });
}

async function saveImage(){

  const target = document.getElementById('capture-area');

  await new Promise(r => setTimeout(r,1000));

  const canvas = await html2canvas(target,{
    useCORS:true,
    allowTaint:true,
    backgroundColor:'#121212',
    scale:2
  });

  const link = document.createElement('a');

  link.download='lunch_worldcup.png';
  link.href=canvas.toDataURL('image/png');

  link.click();
}

</script>

</body>
</html>
