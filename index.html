<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salaria Selection Lab - 오늘 뭐 먹지?</title>
    <style>
        :root {
            --primary-green: #1D7A4D;
            --accent-green: #2ecc71;
            --bg-color: #F9FBFA;
            --glass-white: rgba(255, 255, 255, 0.9);
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: var(--bg-color); 
            min-height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            margin: 0; 
            overflow: hidden;
        }

        /* 배경 장식 (실험실 느낌의 원형 그래픽) */
        .bg-decoration {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(29,122,77,0.05) 0%, transparent 70%);
            z-index: -1; top: -100px; right: -100px;
        }

        .main-card { 
            background: white; padding: 50px 35px; border-radius: 40px; 
            text-align: center; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.04); 
            width: 90%; max-width: 380px; 
            border: 1px solid #f0f0f0;
            position: relative;
        }

        .lab-tag {
            display: inline-block; padding: 4px 12px; border-radius: 20px;
            background: var(--accent-green); color: white;
            font-size: 10px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 15px;
        }

        h1 { 
            color: var(--primary-green); font-size: 32px; 
            font-weight: 800; margin: 0 0 10px 0; 
            letter-spacing: -1px;
        }

        .sub-text { 
            color: #888; font-size: 14px; margin-bottom: 40px; 
            line-height: 1.6; word-break: keep-all;
        }

        .btn-group { display: flex; flex-direction: column; gap: 14px; }
        
        .btn { 
            position: relative;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 20px; border-radius: 20px; 
            text-decoration: none; font-weight: 700; font-size: 16px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
        }

        /* 월드컵 버튼 */
        .btn-green { background: var(--primary-green); color: white; }
        
        /* 슬롯머신 버튼 (메인 포인트) */
        .btn-slot { 
            background: white; color: var(--primary-green);
            box-shadow: inset 0 0 0 2px var(--primary-green);
        }
        .btn-slot:hover { background: var(--primary-green); color: white; }

        /* 메뉴판 버튼 */
        .btn-outline { color: #aaa; font-size: 14px; font-weight: 500; }
        .btn-outline:hover { color: var(--primary-green); text-decoration: underline; }

        .btn:not(.btn-outline):hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 25px rgba(29,122,77,0.15); 
        }

        .footer-credit {
            margin-top: 40px; font-size: 11px; color: #ccc;
            letter-spacing: 0.5px;
        }

        .footer-credit b { color: #aaa; }
    </style>
</head>
<body>
    <div class="bg-decoration"></div>
    
    <div class="main-card">
        <span class="lab-tag">Salaria R&D</span>
        <h1>오늘 뭐 먹지?</h1>
        <p class="sub-text">결정 장애 연구원분들을 위한<br>프리미엄 점심 메뉴 큐레이션</p>
        
        <div class="btn-group">
            <!-- 1. 슬롯머신 (사용자가 가장 즐거워할 모드를 상단으로) -->
            <a href="slot.html" class="btn btn-slot">
                <span>🎰</span> 점심 메뉴 랜덤 슬롯
            </a>

            <!-- 2. 월드컵 모드 -->
            <a href="worldcup.html" class="btn btn-green">
                <span>🏆</span> 메뉴 결정 월드컵
            </a>
            
            <!-- 3. 메뉴판 보기 -->
            <a href="list.html" class="btn btn-outline">📋 전체 메뉴 가이드 보기</a>
        </div>

        <div class="footer-credit">
            Designed by <b>Ju-hee</b> for Salaria Lab
        </div>
    </div>
</body>
</html>
