<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 랜덤 추천 - 필터 설정</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f4f0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { color: #1D7A4D; text-align: center; margin-bottom: 25px; }
        
        .filter-section { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .filter-title { font-weight: bold; margin-bottom: 10px; display: block; color: #444; }
        
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .chip { padding: 8px 15px; border-radius: 20px; background: #f0f0f0; cursor: pointer; font-size: 14px; transition: 0.2s; border: 1px solid transparent; }
        .chip.active { background: #1D7A4D; color: white; border-color: #1D7A4D; }

        .result-area { text-align: center; margin: 30px 0; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #ddd; border-radius: 20px; padding: 20px; }
        #menu-image { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; display: none; border: 4px solid #1D7A4D; }
        #menu-name { font-size: 22px; font-weight: bold; margin: 10px 0; }
        #menu-price { color: #666; font-size: 16px; }

        .btn-spin { width: 100%; padding: 18px; border: none; border-radius: 15px; background: #1D7A4D; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-spin:disabled { background: #ccc; cursor: not-allowed; }
        .btn-back { display: block; text-align: center; margin-top: 20px; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎰 메뉴 슬롯머신</h2>

    <!-- 카테고리 필터 -->
    <div class="filter-section">
        <span class="filter-title">🍴 카테고리 (중복 가능)</span>
        <div id="category-chips" class="chip-group">
            <!-- 자바스크립트로 생성 -->
        </div>
    </div>

    <!-- 금액대 필터 -->
    <div class="filter-section">
        <span class="filter-title">💰 금액대 (중복 가능)</span>
        <div id="price-chips" class="chip-group">
            <div class="chip active" data-range="0-7900">~ 7,900</div>
            <div class="chip active" data-range="8000-8900">8,000 - 8,900</div>
            <div class="chip active" data-range="9000-9900">9,000 - 9,900</div>
            <div class="chip active" data-range="10000-99999">10,000 ~</div>
        </div>
    </div>

    <!-- 결과 창 -->
    <div class="result-area" id="result-area">
        <img id="menu-image" src="" alt="메뉴 이미지">
        <div id="menu-name">조건을 선택하고 돌려보세요!</div>
        <div id="menu-price"></div>
    </div>

    <button class="btn-spin" onclick="spinSlot()">슬롯 돌리기!</button>
    <a href="index.html" class="btn-back">메인으로 돌아가기</a>
</div>

<script>
    let menuData = [];
    const priceChips = document.querySelectorAll('#price-chips .chip');

    // 1. JSON 데이터 로드
    fetch('data.json')
        .then(res => res.json())
        .then(data => {
            menuData = data.categories;
            initFilters();
        });

    // 2. 필터 초기화 (카테고리 칩 생성)
    function initFilters() {
        const container = document.getElementById('category-chips');
        menuData.forEach(cat => {
            const chip = document.createElement('div');
            chip.className = 'chip active';
            chip.innerText = cat.categoryName;
            chip.onclick = () => chip.classList.toggle('active');
            container.appendChild(chip);
        });

        // 금액대 필터 클릭 이벤트
        priceChips.forEach(chip => {
            chip.onclick = () => chip.classList.toggle('active');
        });
    }

    // 3. 슬롯 돌리기 로직
    function spinSlot() {
        const selectedCats = Array.from(document.querySelectorAll('#category-chips .chip.active')).map(c => c.innerText);
        const selectedPriceRanges = Array.from(document.querySelectorAll('#price-chips .chip.active')).map(c => c.dataset.range);

        // 필터링된 메뉴 리스트 만들기
        let filteredMenus = [];
        menuData.forEach(cat => {
            if (selectedCats.includes(cat.categoryName)) {
                cat.items.forEach(item => {
                    const price = parseInt(item.price.replace(',', ''));
                    const isPriceMatch = selectedPriceRanges.some(range => {
                        const [min, max] = range.split('-').map(Number);
                        return price >= min && price <= max;
                    });
                    if (isPriceMatch) filteredMenus.push(item);
                });
            }
        });

        if (filteredMenus.length === 0) {
            alert("선택하신 조건에 맞는 메뉴가 없습니다! 조건을 조정해주세요.");
            return;
        }

        // 애니메이션 효과 시작
        const nameEl = document.getElementById('menu-name');
        const priceEl = document.getElementById('menu-price');
        const imgEl = document.getElementById('menu-image');
        
        let count = 0;
        const interval = setInterval(() => {
            const tempMenu = filteredMenus[Math.floor(Math.random() * filteredMenus.length)];
            nameEl.innerText = tempMenu.name;
            priceEl.innerText = tempMenu.price + "원";
            count++;

            if (count > 15) {
                clearInterval(interval);
                const finalMenu = filteredMenus[Math.floor(Math.random() * filteredMenus.length)];
                nameEl.innerText = finalMenu.name;
                priceEl.innerText = finalMenu.price + "원";
                imgEl.src = finalMenu.image;
                imgEl.style.display = 'block';
            }
        }, 80);
    }
</script>

</body>
</html>
