<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salaria 점심 결정 도우미</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f0f4f0; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .hero { text-align: center; background: white; padding: 50px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); max-width: 450px; width: 90%; }
        .logo-text { color: #1D7A4D; font-size: 40px; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 40px; }
        .btn-group a { display: block; padding: 20px; margin: 15px 0; border-radius: 15px; text-decoration: none; font-weight: bold; font-size: 18px; transition: 0.3s; }
        .btn-cup { background: #1D7A4D; color: white; }
        .btn-list { background: white; color: #1D7A4D; border: 2px solid #1D7A4D; }
        .btn-group a:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(29, 122, 77, 0.2); }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo-text">SALARIA</div>
        <p>오늘 당신의 건강한 점심을 골라드려요</p>
        <div class="btn-group">
            <a href="worldcup.html" class="btn-cup">🏆 점심 메뉴 월드컵 시작</a>
            <a href="list.html" class="btn-list">📋 전체 메뉴 데이터 보기</a>
        </div>
    </div>
</body>
</html>
