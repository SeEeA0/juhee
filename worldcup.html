<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>샐러디아 메뉴 월드컵</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary:#19a463;
      --bg:#121212;
      --card-bg:#1e1e1e;
      --muted:#888;
      --gold:#ffd54f;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family:'Pretendard', -apple-system, sans-serif;
      background:var(--bg);
      color:white;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      overflow-x: hidden;
    }

    .top { text-align:center; padding:20px 10px 5px; flex-shrink:0; }
    .title { font-size:22px; font-weight:800; color:var(--primary); margin-bottom:2px; }
    .sub { color:var(--muted); font-size:11px; text-transform: uppercase; letter-spacing: 1px; }

    #question-view, #game-view, #advance-view, #winner-view {
      width:100%; flex:1; display:none; animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* 메인 선택 카드 */
    #question-view {
      display:flex; flex-direction:column; justify-content:center; align-items:center; gap:16px; padding:20px;
    }
    .question-card {
      width:100%; max-width:400px; padding:35px 25px; border-radius:24px;
      background:var(--card-bg); border:1.5px solid #333; text-align:center;
      transition: var(--transition);
    }
    .question-card:active { transform: scale(0.96); background: #252525; }
    .question-card h2 { font-size:26px; margin-bottom:8px; }

    /* 게임 화면 */
    #match-container {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:12px; padding:10px; max-width:500px; margin:0 auto;
      transition: opacity 0.2s ease;
    }

    .card {
      width:100%; background:var(--card-bg); border-radius:24px;
      overflow:hidden; cursor:pointer; transition: var(--transition);
      border: 2px solid transparent; position: relative;
    }
    .card:active { transform: scale(0.98); }
    .card img { width:100%; aspect-ratio: 1.2 / 1; object-fit:cover; display:block; background:#2a2a2a; }
    .card-body { padding:15px; }
    .menu-name { font-size:18px; font-weight:700; margin-bottom:8px; }
    .menu-info { display:flex; flex-wrap:wrap; gap:6px; }
    .badge { background:rgba(255,255,255,0.1); border-radius:8px; padding:4px 10px; font-size:12px; color:#eee; }
    .badge.price { background: rgba(25, 164, 99, 0.15); color:var(--primary); font-weight:700; }

    .vs { font-size:18px; font-weight:900; color:#ff5252; font-style: italic; margin: -5px 0; z-index: 5; }

    /* 진출/우승 그리드 */
    .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; padding:10px 20px; }
    .grid-item { background:var(--card-bg); border-radius:16px; overflow:hidden; border:1px solid #333; animation: pop 0.3s ease; }
    @keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .grid-item img { width:100%; aspect-ratio:1; object-fit:cover; }
    .grid-item p { padding:8px; font-size:11px; text-align:center; font-weight:bold; }

    /* 버튼 스타일 */
    .btn-wrap { padding:15px 20px 30px; display:flex; flex-direction:column; gap:10px; }
    .btn {
      border:none; color:white; padding:16px; border-radius:18px;
      font-weight:800; font-size:16px; transition: var(--transition); cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-primary { background: var(--primary); width: 100%; }
    .btn-secondary { background: #333; border: 1px solid #444; width: 100%; }
    .btn:disabled { opacity: 0.3; filter: grayscale(1); }
    .btn:active { transform: scale(0.96); }

    .winner-card { border:3px solid var(--gold) !important; box-shadow: 0 0 20px rgba(255, 213, 79, 0.2); }
  </style>
</head>
<body>

  <div class="top">
    <div class="title" id="round-title">메뉴 월드컵</div>
    <div class="sub">Saladia WorldCup</div>
  </div>

  <!-- 1. 시작 화면 -->
  <div id="question-view">
    <div class="question-card" onclick="startWith('light')">
      <h2>🥗 가볍게</h2>
      <small>샐러드 · 샌드위치 · 요거트 · 랩</small>
    </div>
    <div class="question-card" onclick="startWith('heavy')">
      <h2>🍱 든든하게</h2>
      <small>단백질 도시락 · 포케 · 푸드</small>
    </div>
  </div>

  <!-- 2. 게임 진행 화면 -->
  <div id="game-view">
    <div id="match-container"></div>
  </div>

  <!-- 3. 진출 결과 화면 (새로고침 기능 포함) -->
  <div id="advance-view" style="text-align:center;">
    <div class="title" id="advance-title" style="margin-top:20px; color:var(--gold);">8강 진출 메뉴</div>
    <div id="advance-sub" style="color:var(--muted); font-size:13px; margin:5px 0 10px;">결과가 맘에 안 들면 새로고침 하세요!</div>
    <div class="grid" id="advance-grid"></div>
    
    <div class="btn-wrap">
      <button id="advance-refresh-btn" class="btn btn-secondary" onclick="refreshAdvanceList()">
        🔄 후보 새로고침 (<span id="chance-count">3</span>/3)
      </button>
      <button class="btn btn-primary" onclick="confirmAndNextRound()">이대로 8강 시작하기</button>
    </div>
  </div>

  <!-- 4. 최종 우승 화면 -->
  <div id="winner-view" style="text-align:center; padding:30px 20px;">
    <div style="font-size:28px; font-weight:900; color:var(--gold); margin-bottom:20px;">🏆 최종 우승 🏆</div>
    <div id="winner-card-slot" style="max-width:380px; margin:0 auto;"></div>
    <div style="margin-top:30px; display:flex; gap:10px;">
      <button class="btn btn-primary" style="flex:1" onclick="location.reload()">다시하기</button>
      <button class="btn btn-secondary" style="flex:1" onclick="location.href='index.html'">홈으로</button>
    </div>
  </div>

  <script>
    let allData = {};
    let currentType = null;
    let pool = [];
    let winners = [];
    let currentIndex = 0;
    let refreshChances = 3;

    fetch('./data.json').then(res => res.json()).then(data => { allData = data; });

    function getMenus(type) {
      const cats = type === 'light' ? ['샐러드','샌드위치','그릭요거트','랩'] : ['단백질 도시락','포케','푸드'];
      let list = [];
      cats.forEach(c => {
        const items = allData.categories?.find(cat => cat.categoryName === c)?.items || [];
        list.push(...items.filter(i => !i.hidden && i.image));
      });
      return list;
    }

    function startWith(type) {
      currentType = type;
      const menus = shuffle(getMenus(type));
      if (menus.length < 16) return alert('메뉴가 부족합니다.');
      
      pool = menus.slice(0, 16);
      switchView('game-view');
      startRound();
    }

    function startRound() {
      currentIndex = 0;
      winners = [];
      updateRoundUI();
      renderMatch();
    }

    function updateRoundUI() {
      const roundName = pool.length === 2 ? '결승' : `${pool.length}강`;
      document.getElementById('round-title').innerText = roundName;
    }

    function renderMatch() {
      const container = document.getElementById('match-container');
      if (currentIndex >= pool.length) return finishRound();

      container.style.opacity = '0';
      setTimeout(() => {
        const item1 = pool[currentIndex];
        const item2 = pool[currentIndex + 1];
        container.innerHTML = `
          ${createCard(item1, 0)}
          <div class="vs">VS</div>
          ${createCard(item2, 1)}
        `;
        container.style.opacity = '1';
      }, 150);
    }

    function createCard(item, side, isWinner = false) {
      const priceText = (item.price && !isNaN(item.price)) ? `${Number(item.price).toLocaleString()}원` : (item.price || '시가');
      return `
        <div class="card ${isWinner ? 'winner-card' : ''}" ${side !== null ? `onclick="pick(${side})"` : ''}>
          <img src="${item.image}" onerror="this.src='https://images.weserv.nl/?url='+encodeURIComponent('${item.image}')">
          <div class="card-body">
            <div class="menu-name">${item.name}</div>
            <div class="menu-info">
              <span class="badge price">${priceText}</span>
              ${item.kcal ? `<span class="badge">🔥 ${item.kcal}kcal</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function pick(side) {
      winners.push(pool[currentIndex + side]);
      currentIndex += 2;
      renderMatch();
    }

    function finishRound() {
      if (winners.length === 1) return showWinner(winners[0]);
      
      // 16강에서 8강으로 넘어가는 시점에만 새로고침 페이지 노출
      if (winners.length === 8) {
        showAdvancePage(winners);
      } else {
        // 4강 진출 등 다른 라운드는 바로 진행
        pool = [...winners];
        startRound();
      }
    }

    function showAdvancePage(items) {
      switchView('advance-view');
      renderAdvanceGrid(items);
      
      // 새로고침 버튼은 8강 진출 시에만 유효하게 표시
      document.getElementById('advance-refresh-btn').style.display = 'flex';
    }

    function renderAdvanceGrid(items) {
      const grid = document.getElementById('advance-grid');
      grid.innerHTML = items.map(i => `
        <div class="grid-item">
          <img src="${i.image}">
          <p>${i.name}</p>
        </div>
      `).join('');
    }

    // [핵심] 16강 -> 8강 진출 시 메뉴판 새로 엎기
    function refreshAdvanceList() {
      if (refreshChances <= 0) return;

      // 1. 전체 메뉴에서 다시 랜덤하게 8개를 뽑음
      const allPossible = getMenus(currentType);
      const newEight = shuffle(allPossible).slice(0, 8);
      
      // 2. 진출자 명단(winners)을 새 명단으로 교체
      winners = [...newEight];
      
      // 3. UI 업데이트
      renderAdvanceGrid(winners);
      
      refreshChances--;
      document.getElementById('chance-count').innerText = refreshChances;
      if (refreshChances === 0) document.getElementById('advance-refresh-btn').disabled = true;
    }

    function confirmAndNextRound() {
      pool = [...winners];
      switchView('game-view');
      startRound();
    }

    function showWinner(item) {
      switchView('winner-view');
      document.getElementById('winner-card-slot').innerHTML = createCard(item, null, true);
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#19a463', '#ffd54f'] });
    }

    function switchView(id) {
      ['question-view', 'game-view', 'advance-view', 'winner-view'].forEach(v => {
        document.getElementById(v).style.display = (v === id) ? (id === 'question-view' ? 'flex' : 'block') : 'none';
      });
    }

    function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }
  </script>
</body>
</html>
