<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salaria - 프리미엄 메뉴 가이드</title>
    <style>
        :root { 
            --main-green: #1D7A4D; 
            --accent-green: #E8F2ED;
            --text-main: #222;
            --text-sub: #666;
            --bg-gray: #F9FBFA; 
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: var(--bg-gray); margin: 0; padding: 0; 
            scroll-behavior: smooth; /* 부드러운 스크롤 */
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

        header { text-align: center; margin-bottom: 50px; }
        h1 { font-size: 28px; font-weight: 800; color: var(--main-green); margin-bottom: 10px; }
        .back-link { text-decoration: none; color: var(--text-sub); font-size: 14px; font-weight: 500; transition: 0.2s; }
        .back-link:hover { color: var(--main-green); }

        /* 🟢 카테고리 빠른 이동 바 (Sticky LNB) */
        .category-nav {
            position: sticky; top: 0; background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); z-index: 100;
            padding: 15px 0; border-bottom: 1px solid #eee;
            display: flex; justify-content: center; gap: 10px; overflow-x: auto;
        }
        .nav-item {
            padding: 8px 18px; border-radius: 20px; font-size: 13px;
            color: var(--text-sub); text-decoration: none; font-weight: 600;
            white-space: nowrap; transition: 0.3s; border: 1px solid #eee;
        }
        .nav-item:hover { background: var(--accent-green); color: var(--main-green); }

        .category-group { margin-top: 60px; scroll-margin-top: 80px; }
        .category-header { 
            display: flex; align-items: center; gap: 15px; margin-bottom: 25px; 
        }
        .category-name { 
            font-size: 22px; font-weight: 700; color: var(--text-main);
        }
        .category-line { flex-grow: 1; height: 1px; background: #eee; }

        .menu-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; 
        }

        /* 🟢 아이템 카드 스타일 개선 */
        .item-card { 
            background: white; border-radius: 20px; overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f0f0f0;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
        }
        .item-card:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); }

        .img-wrapper { width: 100%; height: 220px; overflow: hidden; background: #fdfdfd; }
        .item-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .item-card:hover .item-img { transform: scale(1.08); }

        .item-info { padding: 20px; }
        .item-name { 
            font-weight: 700; font-size: 17px; margin-bottom: 10px; 
            color: var(--text-main); line-height: 1.4; min-height: 48px;
        }

        /* 🟢 영양 정보 태그화 */
        .nutri-group { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 15px; }
        .nutri-badge { 
            font-size: 11px; padding: 3px 8px; border-radius: 5px; 
            background: var(--bg-gray); color: var(--text-sub); border: 1px solid #eee;
        }

        .item-price { 
            font-size: 19px; font-weight: 800; color: var(--main-green); 
            display: flex; justify-content: flex-end; align-items: baseline;
        }
        .item-price::after { content: '원'; font-size: 14px; margin-left: 2px; font-weight: 500; }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 15px; }
            .item-name { font-size: 15px; }
        }
    </style>
</head>
<body>

    <header class="container">
        <a href="index.html" class="back-link">← 메인 페이지로 이동</a>
        <h1>Premium Menu Guide</h1>
    </header>

    <!-- 카테고리 네비게이션 바 -->
    <nav class="category-nav" id="cat-nav"></nav>

    <div class="container">
        <div id="menu-container"></div>
    </div>

    <script>
        fetch('data.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('menu-container');
                const nav = document.getElementById('cat-nav');

                data.categories.forEach((cat, index) => {
                    const catId = `category-${index}`;
                    
                    // 네비게이션 아이템 추가
                    nav.innerHTML += `<a href="#${catId}" class="nav-item">${cat.categoryName}</a>`;

                    let section = `
                        <div class="category-group" id="${catId}">
                            <div class="category-header">
                                <span class="category-name">${cat.categoryName}</span>
                                <div class="category-line"></div>
                            </div>
                            <div class="menu-grid">`;
                    
                    cat.items.forEach(item => {
                        // 영양 성분이 있을 때만 렌더링
                        let nutriHTML = '';
                        if(item.kcal) nutriHTML += `<span class="nutri-badge">${item.kcal}kcal</span>`;
                        if(item.protein) nutriHTML += `<span class="nutri-badge">단백질 ${item.protein}g</span>`;
                        if(!nutriHTML) nutriHTML = '<span class="nutri-badge">정보 준비 중</span>';

                        section += `
                            <div class="item-card">
                                <div class="img-wrapper">
                                    <img src="${item.image}" class="item-img" onerror="this.src='https://via.placeholder.com/400x400?text=Salaria'">
                                </div>
                                <div class="item-info">
                                    <div class="item-name">${item.name}</div>
                                    <div class="nutri-group">${nutriHTML}</div>
                                    <div class="item-price">${item.price}</div>
                                </div>
                            </div>`;
                    });
                    section += `</div></div>`;
                    container.innerHTML += section;
                });
            });
    </script>
</body>
</html>
