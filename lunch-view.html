<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>식대 정산 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="p-6">

    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-sm border border-slate-200 p-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">5월 식대 정산 대시보드</h1>
            <div class="flex gap-2">
                <button class="px-4 py-2 bg-slate-100 rounded-xl text-slate-600 font-semibold text-sm">리스트형</button>
                <button class="px-4 py-2 bg-slate-900 rounded-xl text-white font-semibold text-sm">달력형</button>
            </div>
        </header>

        <!-- 달력 그리드 -->
        <div class="grid grid-cols-7 gap-2">
            <div class="text-center font-bold text-slate-400 text-xs py-2">일</div>
            <div class="text-center font-bold text-slate-400 text-xs py-2">월</div>
            <div class="text-center font-bold text-slate-400 text-xs py-2">화</div>
            <div class="text-center font-bold text-slate-400 text-xs py-2">수</div>
            <div class="text-center font-bold text-slate-400 text-xs py-2">목</div>
            <div class="text-center font-bold text-slate-400 text-xs py-2">금</div>
            <div class="text-center font-bold text-slate-400 text-xs py-2">토</div>

            <script>
                const userPalette = {
                    '황수석': { bg: 'bg-blue-50', text: 'text-blue-700', border: 'border-blue-200' },
                    '윤책임': { bg: 'bg-green-50', text: 'text-green-700', border: 'border-green-200' },
                    '장책임': { bg: 'bg-purple-50', text: 'text-purple-700', border: 'border-purple-200' },
                    '김대리': { bg: 'bg-red-50', text: 'text-red-700', border: 'border-red-200' },
                    '이과장': { bg: 'bg-orange-50', text: 'text-orange-700', border: 'border-orange-200' },
                    '박사원': { bg: 'bg-yellow-50', text: 'text-yellow-700', border: 'border-yellow-200' }
                };

                for (let i = 1; i <= 31; i++) {
                    const isDay20 = (i === 20);
                    document.write(`
                        <div class="min-h-[120px] border border-slate-100 rounded-2xl p-2 bg-white hover:bg-slate-50 transition">
                            <span class="text-xs font-bold text-slate-400">${i}</span>
                            <div class="mt-2 space-y-1">
                                ${isDay20 ? `
                                    ${[
                                        {name: '황수석', amount: 9900},
                                        {name: '윤책임', amount: 9900},
                                        {name: '장책임', amount: 7000}
                                    ].map(item => `
                                        <div class="flex items-center justify-between px-2 py-1 rounded border ${userPalette[item.name].bg} ${userPalette[item.border] ? userPalette[item.name].border : 'border-slate-200'}">
                                            <span class="text-[10px] font-bold ${userPalette[item.name].text}">${item.name}</span>
                                            <span class="text-[10px] font-bold ${userPalette[item.name].text}">${item.amount.toLocaleString()}</span>
                                        </div>
                                    `).join('')}
                                ` : ''}
                            </div>
                        </div>
                    `);
                }
            </script>
        </div>
    </div>
</body>
</html>
