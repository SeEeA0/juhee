<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>런치 슬롯 - 영양 정보 에디션</title>
    <style>
        :root {
            --primary-color: #1D7A4D;
            --bg-color: #F9FBFA;
            --muted: #888;
        }

        body { 
            font-family: 'Pretendard', -apple-system, sans-serif; 
            background: var(--bg-color); 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            color: #333;
            overflow-x: hidden;
        }

        /* 상단 헤더: 월드컵 페이지와 통일 */
        .top-nav {
            width: 100%;
            padding: 15px 15px 5px;
            position: relative;
            text-align: center;
            background: var(--bg-color);
        }
        .back-link {
            position: absolute;
            left: 15px;
            top: 18px;
            text-decoration: none;
            color: var(--muted);
            font-size: 12px;
            border: 1px solid #ddd;
            padding: 4px 8px;
            border-radius: 8px;
            background: white;
        }

        .container { 
            background: white; padding: 25px 20px; border-radius: 30px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.05); 
            width: 92%; max-width: 450px; box-sizing: border-box; 
            border: 1px solid #f0f0f0;
            margin-top: 10px;
        }

        h2 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 20px; color: var(--primary-color); }

        .filter-section { margin-bottom: 12px; }
        .filter-title { font-weight: 600; margin-bottom: 8px; display: block; color: #666; font-size: 13px; }
        .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { 
            padding: 6px 12px; border-radius: 10px; background: #f2f2f2; 
            cursor: pointer; font-size: 12px; color: #888; transition: 0.2s; 
        }
        .chip.active { background: var(--primary-color); color: white; }

        /* 슬롯 머신 구역 */
        .slot-machine-v2 {
            background: #fff; padding: 8px; border-radius: 20px;
            border: 1px solid #eee; box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            margin: 15px 0; position: relative;
        }

        .window {
            height: 70px; background: #fdfdfd; border-radius: 12px;
            overflow: hidden; position: relative; display: flex;
            align-items: center; justify-content: center; border: 1px solid #f0f0f0;
        }

        .window::before, .window::after {
            content: ''; position: absolute; left: 0; width: 100%; height: 30%; z-index: 2; pointer-events: none;
        }
        .window::before { top: 0; background: linear-gradient(to bottom, rgba(255,255,255,0.9), transparent); }
        .window::after { bottom: 0; background: linear-gradient(to top, rgba(255,255,255,0.9), transparent); }

        .reel { display: flex; flex-direction: column; align-items: center; position: absolute; top: 0; width: 100%; }
        .slot-item { height: 70px; line-height: 70px; text-align: center; font-size: 17px; font-weight: 700; color: #222; width: 100%; }

        /* 결과창: min-height 제거로 밀림 방지 */
        #final-result { text-align: center; margin-top: 0; transition: all 0.3s ease; }
        #result-img { 
            width: 120px; height: 120px; border-radius: 20px; 
            object-fit: cover; display: none; margin: 10px auto 12px; 
            border: 1px solid #eee; animation: slideUp 0.5s ease;
        }

        .info-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; margin-bottom: 8px; }
        .tag { 
            background: #f8f9fa; border: 1px solid #eee; padding: 3px 8px; 
            border-radius: 6px; font-size: 11px; color: #555; font-weight: 500;
        }
        .tag b { color: var(--primary-color); }

        #result-price { font-size: 20px; color: var(--primary-color); font-weight: 800; margin-bottom: 15px; }

        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .btn-spin {
            width: 100%; padding: 16px; border: none; border-radius: 15px;
            background: var(--primary-color); color: white; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: 0.3s; box-shadow: 0 8px 15px rgba(29,122,77,0.15);
        }
        .btn-spin:disabled { background: #d1d1d1; cursor: wait; }
        
        /* 기존 하단 링크 제거 (상단으로 이동함) */
        .btn-back-hidden { display: none; }
    </style>
</head>
<body>

<div class="top-nav">
    <a href="index.html" class="back-link">← HOME</a>
</div>

<div class="container">
    <h2>🥗 런치 슬롯</h2>

    <div class="filter-section">
        <span class="filter-title">카테고리</span>
        <div id="category-chips" class="chip-group"></div>
    </div>
    
    <div class="filter-section">
        <span class="filter-title">가격대</span>
        <div id="price-chips" class="chip-group">
            <div class="chip" data-range="0-7900">~ 7.9</div>
            <div class="chip" data-range="8000-8900">8.0-8.9</div>
            <div class="chip" data-range="9000-9900">9.0-9.9</div>
            <div class="chip" data-range="10000-999999">10.0~</div>
        </div>
    </div>

    <div class="slot-machine-v2">
        <div class="window">
            <div class="reel" id="reel"><div class="slot-item">무엇을 먹을까요?</div></div>
        </div>
    </div>

    <!-- 결과 구역: 평소엔 높이를 차지하지 않음 -->
    <div id="final-result">
        <img id="result-img" src="">
        <div id="info-tags" class="info-tags"></div>
        <div id="result-price"></div>
    </div>

    <button class="btn-spin" id="spin-btn" onclick="spin()">슬롯 돌리기!</button>
</div>

<script>
    let menuData = [];

    // 데이터 로드 및 칩 생성
    fetch('data.json').then(res => res.json()).then(data => {
        menuData = data.categories;
        const container = document.getElementById('category-chips');
        menuData.forEach(cat => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerText = cat.categoryName;
            chip.onclick = () => chip.classList.toggle('active');
            container.appendChild(chip);
        });
    });

    document.querySelectorAll('#price-chips .chip').forEach(c => {
        c.onclick = () => c.classList.toggle('active');
    });

    function spin() {
        const reel = document.getElementById('reel');
        const btn = document.getElementById('spin-btn');
        const img = document.getElementById('result-img');
        const price = document.getElementById('result-price');
        const tags = document.getElementById('info-tags');

        let selectedCats = Array.from(document.querySelectorAll('#category-chips .chip.active')).map(c => c.innerText);
        let selectedPriceRanges = Array.from(document.querySelectorAll('#price-chips .chip.active')).map(c => c.dataset.range);

        let filtered = [];
        menuData.forEach(cat => {
            if (selectedCats.length === 0 || selectedCats.includes(cat.categoryName)) {
                cat.items.forEach(item => {
                    const p = parseInt(item.price.replace(/,/g, ''));
                    const isP = selectedPriceRanges.length === 0 || selectedPriceRanges.some(r => {
                        const [min, max] = r.split('-').map(Number);
                        return p >= min && p <= max;
                    });
                    if (isP) filtered.push(item);
                });
            }
        });

        if (filtered.length === 0) return alert("조건에 맞는 메뉴가 없어요!");

        btn.disabled = true;
        img.style.display = 'none';
        price.innerText = '';
        tags.innerHTML = '';
        reel.innerHTML = '';
        
        const spinCount = 30; 
        for(let i=0; i<spinCount; i++) {
            const item = filtered[Math.floor(Math.random() * filtered.length)];
            const div = document.createElement('div');
            div.className = 'slot-item';
            div.innerText = item.name;
            reel.appendChild(div);
        }

        const finalMenu = filtered[Math.floor(Math.random() * filtered.length)];
        const finalDiv = document.createElement('div');
        finalDiv.className = 'slot-item';
        finalDiv.innerText = finalMenu.name;
        reel.appendChild(finalDiv);

        let startTime = null;
        const duration = 2000; // 조금 더 빠르게 조정
        const itemHeight = 70; // 슬롯 아이템 높이와 일치
        const targetPos = -(spinCount * itemHeight);

        function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = timestamp - startTime;
            const p = Math.min(progress / duration, 1);
            const easedP = easeOutExpo(p);
            reel.style.top = (easedP * targetPos) + 'px';

            if (p < 1) {
                requestAnimationFrame(step);
            } else {
                if(finalMenu.image) { img.src = finalMenu.image; img.style.display = 'block'; }
                
                let tagHTML = '';
                if(finalMenu.weight) tagHTML += `<div class="tag">중량: <b>${finalMenu.weight}</b></div>`;
                if(finalMenu.kcal) tagHTML += `<div class="tag">칼로리: <b>${finalMenu.kcal}</b></div>`;
                if(finalMenu.protein) tagHTML += `<div class="tag">단백질: <b>${finalMenu.protein}</b></div>`;
                tags.innerHTML = tagHTML;

                price.innerText = finalMenu.price + "원";
                btn.disabled = false;
            }
        }
        requestAnimationFrame(step);
    }
</script>
</body>
</html>
