<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>점심 메뉴 월드컵</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary:#19a463;
      --bg:#121212;
      --card-bg:#1e1e1e;
      --muted:#888;
      --gold:#ffd54f;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    body {
      font-family:'Pretendard', -apple-system, sans-serif;
      background:var(--bg);
      color:white;
      height:100dvh; /* 고정 높이로 스크롤 억제 */
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* 상단 헤더 정리 */
    .top {
      padding: 15px 15px 5px;
      position: relative;
      text-align: center;
    }
    .back-link {
      position: absolute;
      left: 15px;
      top: 18px;
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      border: 1px solid #333;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .title { font-size:20px; font-weight:800; color:var(--primary); margin-top: 25px; }
    .sub { color:var(--muted); font-size:10px; letter-spacing:0.5px; margin-top: 2px; }

    /* 뷰 컨테이너 */
    #question-view, #game-view, #advance-view, #final-intro-view, #winner-view {
      width:100%;
      flex:1;
      display:none;
      animation:fadeIn 0.3s ease;
      overflow-y: auto; /* 내용이 많을 때만 스크롤 */
    }

    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    /* 메인 선택 화면 */
    #question-view {
      display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; padding:20px;
    }
    .question-card {
      width:100%; max-width:400px; padding:25px 20px; border-radius:20px;
      background:var(--card-bg); border:1px solid #333; text-align:center;
    }
    .question-card h2 { font-size:18px; margin-bottom:4px; word-break:keep-all; }

    /* 게임 화면 핵심 (가로 배치) */
    #match-container {
      display: flex;
      flex-direction: row; /* 가로로 배치 */
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      height: 70%; /* 이미지 영역 높이 제한 */
    }

    .card {
      flex: 1;
      max-width: 180px;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1.5px solid #333;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1; /* 정사각형으로 고정해서 한눈에 보이게 */
      object-fit: cover;
    }

    .card-body { padding: 10px; text-align: center; }
    .menu-name { font-size: 14px; font-weight: 700; margin-bottom: 5px; word-break: keep-all; height: 2.7em; overflow: hidden; }
    .menu-info { display: flex; flex-direction: column; gap: 3px; align-items: center; }
    .badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.05); }
    .badge.price { color: var(--primary); font-weight: bold; }

    .vs { font-size: 16px; font-weight: 900; color: #ff5252; font-style: italic; }

    .match-refresh-wrap { text-align: center; padding: 10px; }
    .btn-refresh { 
      background: none; border: 1px solid #444; color: var(--muted); 
      padding: 8px 15px; border-radius: 10px; font-size: 12px; 
    }

    /* 우승 화면 등 나머지 */
    .winner-card { max-width: 250px; margin: 0 auto; border: 2px solid var(--gold) !important; }
    .btn { border:none; color:white; padding:14px; border-radius:15px; font-weight:700; cursor:pointer; }
    .btn-primary { background:var(--primary); width:100%; }
    .btn-secondary { background:#333; width:100%; }

    .grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; padding:15px; }
    .grid-item { background:var(--card-bg); border-radius:12px; overflow:hidden; font-size: 11px; text-align: center; }
    .grid-item img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .grid-item p { padding: 5px; }
  </style>
</head>
<body>

  <div class="top">
    <a href="index.html" class="back-link">← HOME</a>
    <div class="title" id="round-title">메뉴 월드컵</div>
    <div class="sub">SALADIA SELECTION LAB</div>
  </div>

  <div id="question-view">
    <div class="question-card" onclick="startWith('light')">
      <h2>🥗 가벼운 식단</h2>
      <small>샐러드 · 샌드위치 · 요거트</small>
    </div>
    <div class="question-card" onclick="startWith('heavy')">
      <h2>🍱 든든한 한끼</h2>
      <small>도시락 · 포케 · 푸드</small>
    </div>
  </div>

  <div id="game-view">
    <div id="match-container"></div>
    <div id="match-refresh-wrap" class="match-refresh-wrap" style="display:none;">
      <button id="match-refresh-btn" class="btn-refresh" onclick="refreshCurrentMatch()">
        🔄 다른 메뉴 보기
      </button>
    </div>
  </div>

  <!-- 나머지 뷰들은 기존 로직 유지 (CSS로 스타일만 보정됨) -->
  <div id="advance-view">
    <div style="text-align:center; padding-top:20px;">
      <h3 id="advance-title" style="color:var(--gold)">진출 메뉴</h3>
      <p id="advance-sub" style="font-size:12px; color:var(--muted)">다음 라운드 진출!</p>
    </div>
    <div class="grid" id="advance-grid"></div>
    <div style="padding:0 20px 20px;">
      <button class="btn btn-primary" id="advance-next-btn" onclick="confirmAndNextRound()">다음 시작</button>
    </div>
  </div>

  <div id="final-intro-view">
    <div style="height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;">
      <h1 style="color:var(--gold); font-size:30px;">결승전</h1>
      <p style="color:var(--muted)">진정한 우승 메뉴는?</p>
    </div>
  </div>

  <div id="winner-view">
    <div style="padding:20px;">
      <h2 style="color:var(--gold); margin-bottom:15px;">🏆 최종 우승 🏆</h2>
      <div id="winner-card-slot"></div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="btn btn-primary" onclick="location.reload()">다시하기</button>
        <button class="btn btn-secondary" onclick="location.href='index.html'">홈으로</button>
      </div>
    </div>
  </div>

  <script>
    /* 스크립트 부분은 기존 로직을 그대로 사용하되, 
       createCard 함수에서 배지 스타일 등을 미세 조정함 */
    let allData = {};
    let currentType = null;
    let pool = [];
    let sparePool = [];
    let winners = [];
    let currentIndex = 0;
    let currentRoundSize = 16;
    let refreshChances = 3;
    let pendingNextPool = [];

    fetch('./data.json')
      .then(res => res.json())
      .then(data => { allData = data; })
      .catch(() => { alert('data.json 로딩 실패'); });

    function getMenus(type) {
      const cats = type === 'light' ? ['샐러드', '샌드위치', '그릭요거트', '랩'] : ['단백질 도시락', '포케', '푸드'];
      let list = [];
      cats.forEach(c => {
        const items = allData.categories?.find(cat => cat.categoryName === c)?.items || [];
        list.push(...items.filter(i => !i.hidden && i.name && i.image));
      });
      return list;
    }

    function startWith(type) {
      currentType = type;
      const menus = shuffle(getMenus(type));
      if (menus.length < 16) { alert('메뉴가 부족합니다.'); return; }
      pool = menus.slice(0, 16);
      sparePool = menus.slice(16);
      currentIndex = 0;
      currentRoundSize = 16;
      refreshChances = 3;
      switchView('game-view');
      startRound();
    }

    function startRound() {
      currentIndex = 0;
      winners = [];
      updateRoundUI();
      renderMatch();
    }

    function updateRoundUI() {
      document.getElementById('round-title').innerText = currentRoundSize === 2 ? '결승전' : `${currentRoundSize}강`;
      const wrap = document.getElementById('match-refresh-wrap');
      wrap.style.display = currentRoundSize === 16 ? 'block' : 'none';
      if(currentRoundSize === 16) {
        document.getElementById('match-refresh-btn').innerText = `🔄 다른 메뉴 (${refreshChances}/3)`;
      }
    }

    function renderMatch() {
      const container = document.getElementById('match-container');
      if (currentIndex >= pool.length) { finishRound(); return; }
      container.style.opacity = '0';
      setTimeout(() => {
        const item1 = pool[currentIndex];
        const item2 = pool[currentIndex + 1];
        container.innerHTML = `
          ${createCard(item1, 0)}
          <div class="vs">VS</div>
          ${createCard(item2, 1)}
        `;
        container.style.opacity = '1';
      }, 100);
    }

    function createCard(item, side, isWinner = false) {
      return `
        <div class="card ${isWinner ? 'winner-card' : ''}" ${side !== null ? `onclick="pick(${side})"` : ''}>
          <img src="${item.image}" alt="${item.name}">
          <div class="card-body">
            <div class="menu-name">${item.name}</div>
            <div class="menu-info">
              ${item.price ? `<span class="badge price">${item.price}</span>` : ''}
              ${item.kcal ? `<span class="badge">🔥 ${item.kcal}kcal</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function pick(side) {
      winners.push(pool[currentIndex + side]);
      currentIndex += 2;
      renderMatch();
    }

    function refreshCurrentMatch() {
      if (currentRoundSize !== 16 || refreshChances <= 0 || sparePool.length < 2) return;
      const old1 = pool[currentIndex]; const old2 = pool[currentIndex + 1];
      pool[currentIndex] = sparePool.shift(); pool[currentIndex+1] = sparePool.shift();
      sparePool.push(old1, old2);
      refreshChances--;
      updateRoundUI();
      renderMatch();
    }

    function finishRound() {
      if (winners.length === 1) { showWinner(winners[0]); return; }
      if (winners.length === 8 || winners.length === 4) {
        showAdvancePage(winners, `🔥 ${winners.length*2}강 통과!`, '다음 라운드로 진출합니다.');
      } else if (winners.length === 2) {
        showFinalIntro(winners);
      } else {
        pool = [...winners]; currentRoundSize = pool.length; startRound();
      }
    }

    function showAdvancePage(items, title, sub) {
      pendingNextPool = [...items];
      document.getElementById('advance-title').innerText = title;
      document.getElementById('advance-sub').innerText = sub;
      const grid = document.getElementById('advance-grid');
      grid.innerHTML = items.map(i => `<div class="grid-item"><img src="${i.image}"><p>${i.name}</p></div>`).join('');
      switchView('advance-view');
    }

    function confirmAndNextRound() {
      pool = [...pendingNextPool]; currentRoundSize = pool.length;
      switchView('game-view'); startRound();
    }

    function showFinalIntro(items) {
      pendingNextPool = [...items];
      switchView('final-intro-view');
      setTimeout(() => { confirmAndNextRound(); }, 1500);
    }

    function showWinner(item) {
      document.getElementById('round-title').innerText = '결과 발표';
      document.getElementById('winner-card-slot').innerHTML = createCard(item, null, true);
      switchView('winner-view');
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    function switchView(id) {
      ['question-view', 'game-view', 'advance-view', 'final-intro-view', 'winner-view'].forEach(v => {
        document.getElementById(v).style.display = (v === id) ? (id.includes('view') && id !== 'game-view' && id !== 'advance-view' ? 'flex' : 'block') : 'none';
      });
    }

    function shuffle(arr) { return [...arr].sort(() => Math.random() - 0.5); }
  </script>
</body>
</html>
