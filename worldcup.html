<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>점심 메뉴 월드컵</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary:#19a463;
      --bg:#121212;
      --card-bg:#1e1e1e;
      --muted:#888;
      --gold:#ffd54f;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    body {
      font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background:var(--bg);
      color:white;
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      overflow-x:hidden;
    }

    .top {
      text-align:center;
      padding:20px 10px 5px;
      flex-shrink:0;
    }

    .title {
      font-size:22px;
      font-weight:800;
      color:var(--primary);
      margin-bottom:2px;
    }

    .sub {
      color:var(--muted);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    #question-view,
    #game-view,
    #advance-view,
    #final-intro-view,
    #winner-view {
      width:100%;
      flex:1;
      display:none;
      animation:fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity:0; }
      to { opacity:1; }
    }

    #question-view {
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:16px;
      padding:20px;
    }

    .question-card {
      width:100%;
      max-width:400px;
      padding:35px 25px;
      border-radius:24px;
      background:var(--card-bg);
      border:1.5px solid #333;
      text-align:center;
      transition:var(--transition);
      cursor:pointer;
    }

    .question-card:active {
      transform:scale(0.96);
      background:#252525;
    }

    .question-card h2 {
      font-size:26px;
      margin-bottom:8px;
    }

    .question-card small {
      color:var(--muted);
    }

    #game-view {
      padding-bottom:20px;
    }

    #match-container {
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding:10px;
      max-width:500px;
      margin:0 auto;
      transition:opacity 0.2s ease;
    }

    .card {
      width:100%;
      background:var(--card-bg);
      border-radius:24px;
      overflow:hidden;
      cursor:pointer;
      transition:var(--transition);
      border:2px solid transparent;
      position:relative;
    }

    .card:active {
      transform:scale(0.98);
    }

    .card img {
      width:100%;
      aspect-ratio:1.2 / 1;
      object-fit:cover;
      display:block;
      background:#2a2a2a;
    }

    .card-body {
      padding:15px;
    }

    .menu-name {
      font-size:18px;
      font-weight:700;
      margin-bottom:8px;
      line-height:1.35;
      word-break:keep-all;
    }

    .menu-info {
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .badge {
      background:rgba(255,255,255,0.1);
      border-radius:8px;
      padding:4px 10px;
      font-size:12px;
      color:#eee;
    }

    .badge.price {
      background:rgba(25,164,99,0.15);
      color:var(--primary);
      font-weight:700;
    }

    .vs {
      font-size:18px;
      font-weight:900;
      color:#ff5252;
      font-style:italic;
      margin:-5px 0;
      z-index:5;
    }

    .match-refresh-wrap {
      max-width:500px;
      margin:4px auto 0;
      padding:0 10px;
      display:none;
    }

    .btn {
      border:none;
      color:white;
      padding:16px;
      border-radius:18px;
      font-weight:800;
      font-size:16px;
      transition:var(--transition);
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .btn-primary {
      background:var(--primary);
      width:100%;
    }

    .btn-secondary {
      background:#333;
      border:1px solid #444;
      width:100%;
    }

    .btn:disabled {
      opacity:0.3;
      filter:grayscale(1);
      cursor:default;
    }

    .btn:active {
      transform:scale(0.96);
    }

    #advance-view {
      text-align:center;
      padding:24px 16px;
    }

    .advance-title {
      font-size:28px;
      font-weight:900;
      color:var(--gold);
      margin-bottom:8px;
    }

    .advance-sub {
      color:var(--muted);
      font-size:14px;
      margin-bottom:18px;
      line-height:1.5;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(2, 1fr);
      gap:10px;
      padding:0;
      max-width:560px;
      margin:0 auto 20px;
    }

    .grid-item {
      background:var(--card-bg);
      border-radius:16px;
      overflow:hidden;
      border:1px solid #333;
      animation:pop 0.3s ease;
    }

    @keyframes pop {
      from { transform:scale(0.9); opacity:0; }
      to { transform:scale(1); opacity:1; }
    }

    .grid-item img {
      width:100%;
      aspect-ratio:1;
      object-fit:cover;
      display:block;
      background:#2a2a2a;
    }

    .grid-item p {
      padding:8px;
      font-size:12px;
      text-align:center;
      font-weight:700;
      line-height:1.35;
      word-break:keep-all;
    }

    .btn-wrap {
      padding:8px 0 10px;
      display:flex;
      flex-direction:column;
      gap:10px;
      max-width:420px;
      margin:0 auto;
    }

    #final-intro-view {
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:30px 20px;
    }

    .final-intro-box {
      margin:auto;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      min-height:60dvh;
    }

    .final-intro-title {
      font-size:34px;
      font-weight:900;
      color:var(--gold);
      line-height:1.35;
      animation:pulse 0.8s ease infinite alternate;
    }

    .final-intro-sub {
      margin-top:12px;
      color:var(--muted);
      font-size:15px;
    }

    @keyframes pulse {
      from { transform:scale(1); opacity:0.85; }
      to { transform:scale(1.04); opacity:1; }
    }

    #winner-view {
      text-align:center;
      padding:30px 20px;
    }

    .winner-title {
      font-size:28px;
      font-weight:900;
      color:var(--gold);
      margin-bottom:20px;
    }

    .winner-card {
      border:3px solid var(--gold) !important;
      box-shadow:0 0 20px rgba(255,213,79,0.2);
      max-width:380px;
      margin:0 auto;
      cursor:default;
    }

    .winner-buttons {
      margin-top:30px;
      display:flex;
      gap:10px;
    }

    .winner-buttons .btn {
      flex:1;
    }
  </style>
</head>

<body>

  
<div class="top">
    <a href="index.html" class="back-link">← 메인 페이지로 이동</a>
    <div class="title" id="round-title">메뉴 월드컵</div>
    <div class="sub">스스로에게 점메추 해보세영</div>
  </div>

  <div id="question-view">
    <div class="question-card" onclick="startWith('light')">
      <h2>출근하는 발걸음은 무겁지만 점심은 🥗 가볍게</h2>
      <small>샐러드 · 샌드위치 · 요거트 · 랩</small>
    </div>

    <div class="question-card" onclick="startWith('heavy')">
      <h2>국밥마냥 🍱 든든하게</h2>
      <small>단백질 도시락 · 포케 · 푸드</small>
    </div>
  </div>

  <div id="game-view">
    <div id="match-container"></div>

    <div id="match-refresh-wrap" class="match-refresh-wrap">
      <button id="match-refresh-btn" class="btn btn-secondary" onclick="refreshCurrentMatch()">
        🔄 이 두 메뉴 말고 다른 메뉴 보기
      </button>
    </div>
  </div>

  <div id="advance-view">
    <div class="advance-title" id="advance-title">진출 메뉴</div>
    <div class="advance-sub" id="advance-sub">다음 라운드에 진출한 메뉴입니다.</div>
    <div class="grid" id="advance-grid"></div>

    <div class="btn-wrap">
      <button class="btn btn-primary" id="advance-next-btn" onclick="confirmAndNextRound()">
        다음 라운드 시작하기
      </button>
    </div>
  </div>

  <div id="final-intro-view">
    <div class="final-intro-box">
      <div class="final-intro-title">과연 오늘의<br>우승 메뉴는?</div>
      <div class="final-intro-sub">잠시 후 결승전이 시작됩니다</div>
    </div>
  </div>

  <div id="winner-view">
    <div class="winner-title">🏆 최종 우승 🏆</div>
    <div id="winner-card-slot"></div>

    <div class="winner-buttons">
      <button class="btn btn-primary" onclick="location.reload()">다시하기</button>
      <button class="btn btn-secondary" onclick="location.href='index.html'">홈으로</button>
    </div>
  </div>

  <script>
    let allData = {};
    let currentType = null;

    let pool = [];
    let sparePool = [];
    let winners = [];
    let currentIndex = 0;
    let currentRoundSize = 16;

    let refreshChances = 3;
    let pendingNextPool = [];

    fetch('./data.json')
      .then(res => res.json())
      .then(data => {
        allData = data;
      })
      .catch(() => {
        alert('data.json 파일을 찾을 수 없습니다. index.html과 같은 위치에 data.json을 넣어주세요.');
      });

    function getMenus(type) {
      const cats = type === 'light'
        ? ['샐러드', '샌드위치', '그릭요거트', '랩']
        : ['단백질 도시락', '포케', '푸드'];

      let list = [];

      cats.forEach(c => {
        const items = allData.categories?.find(cat => cat.categoryName === c)?.items || [];
        list.push(...items.filter(i => !i.hidden && i.name && i.image));
      });

      return list;
    }

    function startWith(type) {
      currentType = type;

      const menus = shuffle(getMenus(type));

      if (menus.length < 16) {
        alert('16강을 만들 메뉴가 부족합니다.');
        return;
      }

      pool = menus.slice(0, 16);
      sparePool = menus.slice(16);
      winners = [];
      currentIndex = 0;
      currentRoundSize = 16;
      refreshChances = 3;

      switchView('game-view');
      startRound();
    }

    function startRound() {
      currentIndex = 0;
      winners = [];
      updateRoundUI();
      updateRefreshButton();
      renderMatch();
    }

    function updateRoundUI() {
      const title = currentRoundSize === 2 ? '결승' : `${currentRoundSize}강`;
      document.getElementById('round-title').innerText = title;
    }

    function updateRefreshButton() {
      const wrap = document.getElementById('match-refresh-wrap');
      const btn = document.getElementById('match-refresh-btn');

      if (currentRoundSize === 16) {
        wrap.style.display = 'block';
        btn.innerText = `🔄 이 두 메뉴 말고 다른 메뉴 보기 (${refreshChances}/3)`;
        btn.disabled = refreshChances <= 0 || sparePool.length < 2;
      } else {
        wrap.style.display = 'none';
      }
    }

    function renderMatch() {
      const container = document.getElementById('match-container');

      if (currentIndex >= pool.length) {
        finishRound();
        return;
      }

      container.style.opacity = '0';

      setTimeout(() => {
        const item1 = pool[currentIndex];
        const item2 = pool[currentIndex + 1];

        container.innerHTML = `
          ${createCard(item1, 0)}
          <div class="vs">VS</div>
          ${createCard(item2, 1)}
        `;

        container.style.opacity = '1';
        updateRefreshButton();
      }, 120);
    }

    function refreshCurrentMatch() {
      if (currentRoundSize !== 16) return;
      if (refreshChances <= 0) return;
      if (sparePool.length < 2) return;

      const old1 = pool[currentIndex];
      const old2 = pool[currentIndex + 1];

      const new1 = sparePool.shift();
      const new2 = sparePool.shift();

      pool[currentIndex] = new1;
      pool[currentIndex + 1] = new2;

      sparePool.push(old1, old2);

      refreshChances--;
      updateRefreshButton();
      renderMatch();
    }

    function createCard(item, side, isWinner = false) {
      return `
        <div class="card ${isWinner ? 'winner-card' : ''}" ${side !== null ? `onclick="pick(${side})"` : ''}>
          ${imageTag(item.image, item.name)}

          <div class="card-body">
            <div class="menu-name">${item.name}</div>

            <div class="menu-info">
              ${item.price ? `<span class="badge price">${formatPrice(item.price)}</span>` : ''}
              ${item.weight ? `<span class="badge">${item.weight}g</span>` : ''}
              ${item.kcal ? `<span class="badge">🔥 ${item.kcal}kcal</span>` : ''}
              ${item.protein ? `<span class="badge">💪 ${item.protein}g</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function formatPrice(price) {
      if (!price) return '';
      const text = String(price);
      return text.includes('원') ? text : `${text}원`;
    }

    function imageTag(url, alt = '') {
      const proxy = proxyUrl(url);

      return `
        <img
          src="${url}"
          alt="${alt}"
          loading="eager"
          referrerpolicy="no-referrer"
          data-proxy="${proxy}"
          onerror="this.onerror=null; this.src=this.dataset.proxy;"
        >
      `;
    }

    function proxyUrl(url) {
      if (!url) return '';
      if (url.startsWith('data:')) return url;
      return 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace(/^https?:\/\//, ''));
    }

    function pick(side) {
      winners.push(pool[currentIndex + side]);
      currentIndex += 2;
      renderMatch();
    }

    function finishRound() {
      if (winners.length === 1) {
        showWinner(winners[0]);
        return;
      }

      if (winners.length === 8) {
        showAdvancePage(
          winners,
          '🔥 8강 진출 메뉴',
          '16강에서 살아남은 메뉴입니다.',
          '8강 시작하기'
        );
        return;
      }

      if (winners.length === 4) {
        showAdvancePage(
          winners,
          '🔥 4강 진출 메뉴',
          '8강에서 선택된 메뉴입니다.',
          '4강 시작하기'
        );
        return;
      }

      if (winners.length === 2) {
        showFinalIntro(winners);
        return;
      }

      pool = [...winners];
      currentRoundSize = pool.length;
      startRound();
    }

    function showAdvancePage(items, title, sub, buttonText) {
      pendingNextPool = [...items];

      document.getElementById('round-title').innerText = '메뉴 월드컵';
      document.getElementById('advance-title').innerText = title;
      document.getElementById('advance-sub').innerText = sub;
      document.getElementById('advance-next-btn').innerText = buttonText;

      const grid = document.getElementById('advance-grid');
      grid.innerHTML = items.map(i => `
        <div class="grid-item">
          ${imageTag(i.image, i.name)}
          <p>${i.name}</p>
        </div>
      `).join('');

      switchView('advance-view');
    }

    function confirmAndNextRound() {
      pool = [...pendingNextPool];
      currentRoundSize = pool.length;

      switchView('game-view');
      startRound();
    }

    function showFinalIntro(items) {
      pendingNextPool = [...items];

      document.getElementById('round-title').innerText = '결승 준비';
      switchView('final-intro-view');

      setTimeout(() => {
        pool = [...pendingNextPool];
        currentRoundSize = 2;
        switchView('game-view');
        startRound();
      }, 1300);
    }

    function showWinner(item) {
      document.getElementById('round-title').innerText = '월드컵 종료';

      document.getElementById('winner-card-slot').innerHTML = createCard(item, null, true);

      switchView('winner-view');

      confetti({
        particleCount: 180,
        spread: 90,
        origin: { y: 0.6 },
        colors: ['#19a463', '#ffd54f', '#ffffff', '#ff5252']
      });
    }

    function switchView(id) {
      ['question-view', 'game-view', 'advance-view', 'final-intro-view', 'winner-view'].forEach(v => {
        const el = document.getElementById(v);
        if (!el) return;

        if (v === id) {
          if (id === 'question-view' || id === 'final-intro-view') {
            el.style.display = 'flex';
          } else {
            el.style.display = 'block';
          }
        } else {
          el.style.display = 'none';
        }
      });
    }

    function shuffle(arr) {
      return [...arr].sort(() => Math.random() - 0.5);
    }
  </script>

</body>
</html>
