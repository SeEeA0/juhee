<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 랜덤 추천 - 원통형 슬롯</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; background: #f0f4f0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: white; padding: 30px; border-radius: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 450px; box-sizing: border-box; }
        h2 { color: #1D7A4D; text-align: center; margin-bottom: 25px; font-size: 24px; }

        /* 필터 디자인 */
        .filter-section { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .filter-title { font-weight: bold; margin-bottom: 10px; display: block; color: #444; font-size: 13px; }
        .chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { padding: 6px 12px; border-radius: 15px; background: #f8f8f8; cursor: pointer; font-size: 12px; border: 1px solid #eee; color: #777; transition: 0.2s; }
        .chip.active { background: #1D7A4D; color: white; border-color: #1D7A4D; font-weight: 600; }

        /* 원통형 슬롯 핵심 디자인 */
        .slot-machine {
            background: #222;
            padding: 20px;
            border-radius: 20px;
            border: 8px solid #333;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
            margin: 20px 0;
            position: relative;
        }

        .window {
            height: 100px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 입체감을 주는 마스킹 효과 */
        .window::before, .window::after {
            content: '';
            position: absolute;
            left: 0; width: 100%; height: 30%; z-index: 2;
            pointer-events: none;
        }
        .window::before { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.3), transparent); }
        .window::after { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.3), transparent); }

        .reel {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 0;
            transition: top 0.1s linear;
            width: 100%;
        }

        .slot-item {
            height: 100px;
            line-height: 100px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 1px solid #eee;
            background: white;
        }

        /* 결과 강조 구역 */
        #final-result {
            margin-top: 20px;
            text-align: center;
            min-height: 160px;
        }
        #result-img { width: 120px; height: 120px; border-radius: 15px; object-fit: cover; display: none; margin: 10px auto; border: 3px solid #1D7A4D; animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #result-price { font-size: 18px; color: #1D7A4D; font-weight: bold; margin-top: 5px; }

        @keyframes pop {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .btn-spin {
            width: 100%; padding: 18px; border: none; border-radius: 15px;
            background: #1D7A4D; color: white; font-size: 18px; font-weight: bold;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(29,122,77,0.3);
        }
        .btn-spin:disabled { background: #999; cursor: not-allowed; }
        .btn-back { display: block; text-align: center; margin-top: 15px; color: #999; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🎰 런치 드럼 슬롯</h2>

    <!-- 필터 섹션 -->
    <div class="filter-section">
        <span class="filter-title">🍴 카테고리 (미선택 시 전체)</span>
        <div id="category-chips" class="chip-group"></div>
    </div>
    <div class="filter-section">
        <span class="filter-title">💰 가격대 (미선택 시 전체)</span>
        <div id="price-chips" class="chip-group">
            <div class="chip" data-range="0-7900">~ 7,900</div>
            <div class="chip" data-range="8000-8900">8,000-8,900</div>
            <div class="chip" data-range="9000-9900">9,000-9,900</div>
            <div class="chip" data-range="10000-999999">10,000~</div>
        </div>
    </div>

    <!-- 원통형 슬롯 영역 -->
    <div class="slot-machine">
        <div class="window">
            <div class="reel" id="reel">
                <div class="slot-item">준비!</div>
            </div>
        </div>
    </div>

    <div id="final-result">
        <img id="result-img" src="">
        <div id="result-price"></div>
    </div>

    <button class="btn-spin" id="spin-btn" onclick="spin()">슬롯 돌리기!</button>
    <a href="index.html" class="btn-back">🔙 처음으로</a>
</div>

<script>
    let menuData = [];

    fetch('data.json').then(res => res.json()).then(data => {
        menuData = data.categories;
        const container = document.getElementById('category-chips');
        menuData.forEach(cat => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerText = cat.categoryName;
            chip.onclick = () => chip.classList.toggle('active');
            container.appendChild(chip);
        });
    });

    document.querySelectorAll('#price-chips .chip').forEach(c => {
        c.onclick = () => c.classList.toggle('active');
    });

    function spin() {
        const reel = document.getElementById('reel');
        const btn = document.getElementById('spin-btn');
        const img = document.getElementById('result-img');
        const price = document.getElementById('result-price');

        // 필터링
        let selectedCats = Array.from(document.querySelectorAll('#category-chips .chip.active')).map(c => c.innerText);
        let selectedPriceRanges = Array.from(document.querySelectorAll('#price-chips .chip.active')).map(c => c.dataset.range);

        let filtered = [];
        menuData.forEach(cat => {
            if (selectedCats.length === 0 || selectedCats.includes(cat.categoryName)) {
                cat.items.forEach(item => {
                    const p = parseInt(item.price.replace(/,/g, ''));
                    const isP = selectedPriceRanges.length === 0 || selectedPriceRanges.some(r => {
                        const [min, max] = r.split('-').map(Number);
                        return p >= min && p <= max;
                    });
                    if (isP) filtered.push(item);
                });
            }
        });

        if (filtered.length === 0) return alert("조건에 맞는 메뉴가 없어요!");

        // 릴 아이템 생성 (슈슈슉 넘어가는 느낌을 위해 랜덤하게 많이 생성)
        btn.disabled = true;
        img.style.display = 'none';
        price.innerText = '';
        
        reel.innerHTML = '';
        const spinCount = 20; // 몇 번 굴릴지
        for(let i=0; i<spinCount; i++) {
            const item = filtered[Math.floor(Math.random() * filtered.length)];
            const div = document.createElement('div');
            div.className = 'slot-item';
            div.innerText = item.name;
            reel.appendChild(div);
        }

        // 최종 결과 메뉴 결정 및 추가
        const finalMenu = filtered[Math.floor(Math.random() * filtered.length)];
        const finalDiv = document.createElement('div');
        finalDiv.className = 'slot-item';
        finalDiv.innerText = finalMenu.name;
        reel.appendChild(finalDiv);

        // 애니메이션 작동
        let currentPos = 0;
        let targetPos = -(spinCount * 100);
        let startTime = null;
        const duration = 2500; // 2.5초 동안 돌아감

        function easeOutQuart(t) { return 1 - (--t) * t * t * t; } // 점점 느려지는 효과

        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            const progress = timestamp - startTime;
            const p = Math.min(progress / duration, 1);
            const easedP = easeOutQuart(p);
            
            reel.style.top = (easedP * targetPos) + 'px';

            if (p < 1) {
                requestAnimationFrame(step);
            } else {
                // 종료 후 결과 처리
                if(finalMenu.image) {
                    img.src = finalMenu.image;
                    img.style.display = 'block';
                }
                price.innerText = finalMenu.price + "원";
                btn.disabled = false;
            }
        }
        requestAnimationFrame(step);
    }
</script>
</body>
</html>
